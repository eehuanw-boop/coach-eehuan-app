<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BurnUp Coach</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<meta name="theme-color" content="#0B0A09" />
<meta name="description" content="BurnUp × Herbalife 学员教练工具：算出每日卡路里，生成一日餐单与训练计划。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
/* Layout: one mobile app column; one question per screen → one result screen. BurnUp dark, single theme by choice. */
:root{
  --bg:#0B0A09;          /* gym-floor black, warm */
  --panel:#171412;
  --line:#2C2621;
  --fg:#F7F3EE;
  --muted:#A39A90;
  --orange:#FF6A00;      /* BurnUp orange */
  --yellow:#FFC300;      /* energy yellow */
  --ink:#140B02;         /* text on orange */
  --good:#3DDC84;
  --warn:#FFB020;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.app{max-width:560px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.04em;line-height:1;background:none;border:0;padding:0}
.brand b{color:var(--orange);font-weight:400}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);margin-left:8px;vertical-align:middle}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}

/* home */
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,60px);line-height:.98;margin:8px 0 10px;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{margin:0;color:var(--muted);max-width:40ch}
.paths{display:grid;gap:12px}
.path{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.path:hover{border-color:var(--orange)}
.path .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--orange)}
.path h2{margin:4px 0 4px;font-size:22px;font-weight:900}
.path p{margin:0;color:var(--muted);font-size:13px}
.path .go{font-family:var(--display);font-size:28px;color:var(--orange)}
.path.primary{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.path.primary .k,.path.primary p,.path.primary .go{color:var(--ink)}

/* quiz */
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .3s}
.step-k{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.12em}
.q{font-size:clamp(26px,7vw,34px);font-weight:900;line-height:1.2;margin:6px 0 4px;text-wrap:balance}
.hint{color:var(--muted);margin:0;font-size:13px}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;font-size:17px;font-weight:700}
.opt span{font-weight:400;font-size:13px;color:var(--muted)}
.opt:hover,.opt.on{border-color:var(--orange)}
.opt.on{background:rgba(255,106,0,.12)}
.field{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--orange);padding-bottom:6px}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font-family:var(--display);font-size:64px;line-height:1;padding:0;outline:none}
.field input::placeholder{color:#3a332d}
.field .u{font-family:var(--mono);color:var(--muted);font-size:18px}
.err{color:var(--warn);font-size:13px;min-height:1.2em;margin:0}
.cta{width:100%;background:var(--orange);color:var(--ink);border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:900;letter-spacing:.04em}
.cta:disabled{opacity:.35;cursor:default}
.cta.alt{background:none;color:var(--fg);border:1.5px solid var(--line)}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:4px 0;font-size:14px}

/* result */
.target{background:var(--orange);color:var(--ink);border-radius:16px;padding:20px 20px 18px;display:grid;gap:6px}
.target .k{font-family:var(--mono);font-size:11px;letter-spacing:.16em}
.target .big{font-family:var(--display);font-size:clamp(64px,20vw,96px);line-height:.95}
.target .big small{font-size:.32em;margin-left:6px}
.target .math{font-family:var(--mono);font-size:12px;line-height:1.7;opacity:.85}
.who{font-size:13px;color:var(--muted)}
.note{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0 -8px}
.sec-h h3{margin:0;font-size:13px;font-family:var(--mono);letter-spacing:.16em;color:var(--muted);font-weight:500}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.toggle b{display:block;font-size:15px}
.toggle span{font-size:12px;color:var(--muted)}
.sw{flex:none;width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--orange)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(20px)}

.shake{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.shake p{margin:0;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:none;border-radius:99px;padding:7px 12px;font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--yellow);color:var(--fg);background:rgba(255,195,0,.1)}
.chip.lock{cursor:default}
.chip i{font-style:normal;font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.8}

.day{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.meal{position:relative;padding:0 0 18px 20px}
.meal:last-child{padding-bottom:0}
.meal::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--orange)}
.meal.fixed::before{border-color:var(--yellow)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meal-h .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.meal-h h4{margin:0;font-size:17px;font-weight:900}
.meal-h .kc{font-family:var(--display);font-size:24px;color:var(--orange);white-space:nowrap}
.meal-h .kc small{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:2px}
.meal .what{margin:4px 0 0;font-size:14px}
.meal .sub{margin:2px 0 0;font-size:12px;color:var(--muted)}
.plate{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plate span{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.plate span b{color:var(--yellow);font-weight:700}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum div{background:var(--panel);padding:12px;display:grid;gap:2px}
.sum span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
.sum b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}

.menu{display:grid;gap:10px}
.menu div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.menu h5{margin:0 0 4px;font-size:12px;font-family:var(--mono);letter-spacing:.12em;color:var(--orange);font-weight:500}
.menu p{margin:0;font-size:14px}
.guide{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:4px}
.guide b{color:var(--fg)}
.actions{display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:20}

/* fitness */
.wk{display:grid;gap:12px}
.wd{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wd-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.wd-h b{font-size:16px}
.wd-h span{font-family:var(--mono);font-size:11px;color:var(--orange);letter-spacing:.1em}
.ex{list-style:none;margin:0;padding:6px 14px 10px}
.ex li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ex li:last-child{border-bottom:0}
.ex li em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rules div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.rules span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
.rules b{font-size:15px}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ 数据与公式 ============ */
const ACT = [
  {v:1.2,  t:"久坐",   s:"办公室，几乎不运动"},
  {v:1.375,t:"轻度活动",s:"每周运动 1–3 次"},
  {v:1.55, t:"中度活动",s:"每周运动 3–5 次"},
  {v:1.725,t:"高度活动",s:"每周运动 6–7 次"},
  {v:1.9,  t:"极高活动",s:"体力劳动 + 每天训练"}
];
const GOALS = {
  gain:    {t:"增肌增重", s:"想长肉、变壮"},
  lose:    {t:"减脂减重", s:"想掉秤、瘦下来"},
  keepLose:{t:"维持体重 · 减脂", s:"体重不变，体脂下降"},
  keepGain:{t:"维持体重 · 增肌", s:"体重不变，肌肉增加"}
};
function adjust(goal, age){
  const over40 = age >= 40;
  switch(goal){
    case "gain": return over40 ? 300 : 500;
    case "lose": return over40 ? -300 : -500;
    case "keepLose": return -200;
    case "keepGain": return 200;
  }
  return 0;
}
// Mifflin-St Jeor
function bmr(a){ return 10*a.weight + 6.25*a.height - 5*a.age + (a.gender==="m" ? 5 : -161); }

const SHAKE_ITEMS = [
  {id:"f1",   t:"Formula 1 奶昔", k:100, lock:true},
  {id:"f3",   t:"+ Formula 3",    k:40},
  {id:"milk", t:"250ml 低脂牛奶", k:120},
  {id:"banana",t:"半条香蕉",      k:60}
];
const WHEY = 165;
const LUNCH = [800,600,400];
const DINNER = [800,600,400,300];
const PORTION = {
  800:{rice:"一碗饭", pro:"两份蛋白质", veg:"一份蔬菜"},
  600:{rice:"一碗饭", pro:"一份蛋白质", veg:"一份蔬菜"},
  400:{rice:"半碗饭", pro:"一份蛋白质", veg:"一份蔬菜"},
  300:{rice:null,     pro:"一份蛋白质", veg:"一份蔬菜"}
};
const FLOOR = {f:1200, m:1500};

/* ============ 状态 ============ */
const S = {
  view:"home",
  step:0,
  a:{gender:null, age:null, height:null, weight:null, activity:null, goal:null},
  shake:{f1:true, f3:true, milk:true, banana:false},
  training:true,
  fit:{goal:null, days:null, step:0}
};

const STEPS = [
  {key:"gender", q:"性别？", type:"choice", opts:[{v:"f",t:"女生"},{v:"m",t:"男生"}]},
  {key:"age", q:"今年几岁？", hint:"40 岁以上，热量调整幅度会更温和。", type:"num", unit:"岁", min:15, max:90},
  {key:"height", q:"身高多少？", type:"num", unit:"cm", min:120, max:220},
  {key:"weight", q:"现在体重？", hint:"早上空腹称最准。", type:"num", unit:"kg", min:30, max:250, dec:true},
  {key:"activity", q:"平时的活动量？", hint:"选最接近你平常一周的状态。", type:"choice", opts:ACT.map(x=>({v:x.v,t:x.t,s:x.s}))},
  {key:"goal", q:"你的目标是？", type:"choice", opts:Object.entries(GOALS).map(([v,g])=>({v,t:g.t,s:g.s}))}
];

/* ============ 计算餐单 ============ */
function calc(){
  const a = S.a;
  const b = bmr(a);
  const tdee = Math.round(b * a.activity);
  const adj = adjust(a.goal, a.age);
  let target = tdee + adj;
  let floored = false;
  if(target < FLOOR[a.gender]){ target = FLOOR[a.gender]; floored = true; }
  target = Math.round(target/10)*10;

  const shakeK = SHAKE_ITEMS.reduce((s,i)=> s + (S.shake[i.id] ? i.k : 0), 0);
  const fixed = shakeK*2 + (S.training ? WHEY : 0);
  const remaining = target - fixed;

  // 选出最接近的午餐+晚餐组合；同分时偏向「午餐 ≥ 晚餐」
  let best = null;
  for(const L of LUNCH) for(const D of DINNER){
    const score = Math.abs(L + D - remaining) + (D > L ? 30 : 0);
    if(!best || score < best.score) best = {L, D, score};
  }
  // 热量需求很高时追加加餐
  const extras = [];
  let gap = remaining - best.L - best.D;
  let wheyAdded = false;
  while(gap >= 150 && extras.length < 4){
    if(!S.training && !wheyAdded){ extras.push({t:"RS Pro Whey 蛋白", k:WHEY}); gap -= WHEY; wheyAdded = true; }
    else { extras.push({t:"Formula 1 奶昔（同早餐配方）", k:shakeK}); gap -= shakeK; }
  }
  const total = fixed + best.L + best.D + extras.reduce((s,e)=>s+e.k,0);
  return {bmr:Math.round(b), tdee, adj, target, floored, shakeK, L:best.L, D:best.D, extras, total, diff: total - target, tooLow: remaining - 700 <= -150, tooHigh: total - target <= -300};
}

/* ============ 渲染 ============ */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const topBar = () => `<div class="top"><button class="brand" data-go="home" aria-label="回到首页"><b>BURN</b>UP<small>COACH</small></button>${S.view!=="home" ? `<button class="ghost" data-go="home">首页</button>` : ""}</div>`;

function render(){
  if(S.view==="home") $app.innerHTML = topBar() + home();
  else if(S.view==="quiz") $app.innerHTML = topBar() + quiz();
  else if(S.view==="plan") $app.innerHTML = topBar() + plan();
  else if(S.view==="fitq") $app.innerHTML = topBar() + fitQuiz();
  else if(S.view==="fit") $app.innerHTML = topBar() + fitPlan();
  const inp = $app.querySelector("input");
  if(inp) inp.focus({preventScroll:true});
  window.scrollTo(0,0);
}

function home(){
  return `
  <section class="hero">
    <h1>吃对 + 练对<br><em>结果自然来</em></h1>
    <p>BurnUp × Herbalife 教练工具。回答 6 个问题，拿到你的每日卡路里和一日餐单。</p>
  </section>
  <div class="paths">
    <button class="path primary" data-go="quiz">
      <div><div class="k">MEAL PLAN COACHING</div><h2>我的一日餐单</h2><p>算出 TDEE 与每日摄入目标，自动配好三餐分量</p></div>
      <div class="go">→</div>
    </button>
    <button class="path" data-go="fitq">
      <div><div class="k">FITNESS COACHING</div><h2>我的训练计划</h2><p>按目标和每周天数，给你一份照着练的课表</p></div>
      <div class="go">→</div>
    </button>
  </div>
  <p class="foot">计算结果为参考值，特殊健康状况请先咨询医生。</p>`;
}

function quiz(){
  const st = STEPS[S.step];
  const val = S.a[st.key];
  const pct = ((S.step) / STEPS.length) * 100;
  let body = "";
  if(st.type === "choice"){
    body = `<div class="opts">${st.opts.map(o=>`
      <button class="opt ${val===o.v?"on":""}" data-pick="${o.v}">${esc(o.t)}${o.s?`<span>${esc(o.s)}</span>`:""}</button>`).join("")}</div>`;
  } else {
    body = `
    <form id="numf" novalidate>
      <label class="field" for="in-${st.key}">
        <input id="in-${st.key}" type="number" inputmode="${st.dec?"decimal":"numeric"}" step="${st.dec?"0.1":"1"}" placeholder="0" value="${val ?? ""}" aria-label="${esc(st.q)}" />
        <span class="u">${st.unit}</span>
      </label>
      <p class="err" id="err"></p>
      <button class="cta" type="submit">下一步</button>
    </form>`;
  }
  return `
  <div class="bar"><i style="width:${pct}%"></i></div>
  ${S.step>0 ? `<button class="back" data-back>← 上一题</button>` : ""}
  <div>
    <div class="step-k num">问题 ${S.step+1} / ${STEPS.length}</div>
    <div class="q">${esc(st.q)}</div>
    ${st.hint ? `<p class="hint">${esc(st.hint)}</p>` : ""}
  </div>
  ${body}`;
}

function mealBlock(time, name, kcal, inner, fixed){
  return `<li class="meal ${fixed?"fixed":""}">
    <div class="meal-h"><div><div class="t">${time}</div><h4>${name}</h4></div><div class="kc num">${kcal}<small>kcal</small></div></div>
    ${inner}</li>`;
}
function shakeText(){
  return SHAKE_ITEMS.filter(i=>S.shake[i.id]).map(i=>i.t.replace(/^\+ /,"")).join(" + ");
}
function plateHTML(k){
  const p = PORTION[k];
  return `<div class="plate">
    ${p.rice ? `<span>碳水 <b>${p.rice}</b></span>` : `<span>碳水 <b>不吃</b></span>`}
    <span>蛋白质 <b>${p.pro}</b></span>
    <span>蔬菜 <b>${p.veg}</b></span></div>`;
}

function plan(){
  const a = S.a, r = calc();
  const g = GOALS[a.goal];
  const act = ACT.find(x=>x.v===a.activity);
  const adjTxt = (r.adj>0?"+":"") + r.adj;
  const shakeLine = `<p class="what">${esc(shakeText())}</p>${S.shake.milk?`<p class="sub">只用低脂牛奶冲泡，不用全脂</p>`:`<p class="sub">用清水冲泡</p>`}`;
  const diffTxt = (r.diff>0?"+":"") + r.diff;

  let meals = "";
  meals += mealBlock("07:30","早餐 · 营养奶昔", r.shakeK, shakeLine, true);
  meals += mealBlock("12:30","午餐", r.L, plateHTML(r.L));
  meals += mealBlock("16:00","下午茶 · 营养奶昔", r.shakeK, shakeLine, true);
  if(S.training) meals += mealBlock("训练后","RS Pro Whey 蛋白", WHEY, `<p class="what">重训 / 运动后 30 分钟内喝</p>`, true);
  meals += mealBlock("19:00","晚餐", r.D, plateHTML(r.D));
  r.extras.forEach(e => meals += mealBlock("21:00","加餐", e.k, `<p class="what">${esc(e.t)}</p><p class="sub">你的热量需求较高，三餐之外补这一份</p>`, true));

  return `
  <button class="back" data-go="quiz-edit">← 修改资料</button>
  <div class="who">${a.gender==="m"?"男":"女"} · ${a.age} 岁 · ${a.height} cm · ${a.weight} kg · ${act.t} · <b style="color:var(--fg)">${g.t}</b></div>
  <section class="target">
    <div class="k">每日摄入目标</div>
    <div class="big num">${r.target}<small>kcal</small></div>
    <div class="math num">TDEE 维持热量 ${r.tdee} kcal　${adjTxt} kcal（${g.t}${(a.goal==="gain"||a.goal==="lose")&&a.age>=40?" · 40+":""}）</div>
  </section>
  ${r.floored ? `<div class="note">计算值低于安全下限，已调整为 ${FLOOR[a.gender]} kcal。长期吃太少会掉肌肉、代谢变慢。</div>` : ""}

  <div class="sec-h"><h3>今日设置</h3></div>
  <button class="toggle" data-train aria-pressed="${S.training}">
    <div><b>今天有训练</b><span>开启会加入运动后 RS Pro Whey（${WHEY} kcal），午晚餐自动调整</span></div><div class="sw"></div>
  </button>
  <div class="shake">
    <p>早餐 & 下午茶奶昔配方（两餐一致）</p>
    <div class="chips">${SHAKE_ITEMS.map(i=>`<button class="chip ${S.shake[i.id]?"on":""} ${i.lock?"lock":""}" data-shake="${i.id}" ${i.lock?'aria-disabled="true"':""}>${i.t}<i>${i.k}</i></button>`).join("")}</div>
  </div>

  <div class="sec-h"><h3>一日餐单</h3></div>
  <ul class="day">${meals}</ul>

  <div class="sum num">
    <div><span>目标</span><b>${r.target}</b></div>
    <div><span>餐单合计</span><b>${r.total}</b></div>
    <div><span>差距</span><b style="color:${Math.abs(r.diff)<=100?"var(--good)":"var(--warn)"}">${diffTxt}</b></div>
  </div>
  ${r.tooLow ? `<div class="note">午晚餐已是最小分量。可以把奶昔改成清水冲泡、或去掉香蕉，让总热量更贴近目标。</div>` : ""}

  ${r.tooHigh ? `<div class="note">热量需求很高。午餐和晚餐可以各多加半碗饭或一份蛋白质，补足差距。</div>` : ""}

  <div class="sec-h"><h3>午餐 / 晚餐怎么选</h3></div>
  <div class="menu">
    <div><h5>碳水（选 1）</h5><p>白饭 · 糙米饭 · Soba 荞麦面 · 土豆</p></div>
    <div><h5>蛋白质（选 1–2）</h5><p>鸡肉 · 鱼肉 · 鸡蛋 · 瘦牛肉<br>素食：豆腐 · Tempeh</p></div>
    <div><h5>蔬菜</h5><p>各种绿色蔬菜，越多颜色越好</p></div>
  </div>
  <ul class="guide">
    <li><b>一份蛋白质</b> ≈ 一个手掌的大小和厚度（约 2 颗蛋）</li>
    <li><b>一份蔬菜</b> ≈ 两个拳头</li>
    <li><b>一碗饭</b> = 一碗糙米饭 = 一份熟 Soba = 一个中型土豆</li>
    <li>少油少酱，煎炸改成蒸、烤、水煮</li>
  </ul>

  <div class="actions">
    <button class="cta" data-copy="meal">复制餐单发给学员</button>
    <button class="cta alt" data-go="fitq">下一步：看训练计划 →</button>
  </div>`;
}

/* ============ 训练 ============ */
const FIT_GOALS = [
  {v:"build", t:"增肌 / 变壮", s:"对应：增肌增重、维持体重增肌"},
  {v:"burn",  t:"减脂 / 变瘦", s:"对应：减脂减重、维持体重减脂"}
];
const DAYS = [
  {v:3, t:"每周 3 天", s:"新手首选，全身训练"},
  {v:4, t:"每周 4 天", s:"上肢 / 下肢分开练"},
  {v:5, t:"每周 5 天", s:"推 / 拉 / 腿 + 上 / 下"}
];
const SPLITS = {
  3:[
    {n:"Day 1 · 全身 A", f:"FULL BODY", ex:["杠铃 / 高脚杯深蹲","哑铃卧推","坐姿划船","哑铃肩推","平板支撑 3×40秒"]},
    {n:"Day 2 · 全身 B", f:"FULL BODY", ex:["罗马尼亚硬拉","高位下拉","哑铃弓步蹲","上斜哑铃卧推","死虫 3×12"]},
    {n:"Day 3 · 全身 C", f:"FULL BODY", ex:["腿举","器械推胸 / 俯卧撑","单臂哑铃划船","臀桥","侧平板 3×30秒"]}
  ],
  4:[
    {n:"Day 1 · 上肢 A", f:"UPPER", ex:["杠铃 / 哑铃卧推","坐姿划船","哑铃肩推","高位下拉","哑铃弯举","绳索下压"]},
    {n:"Day 2 · 下肢 A", f:"LOWER", ex:["深蹲","罗马尼亚硬拉","哑铃弓步蹲","腿弯举","提踵"]},
    {n:"Day 3 · 上肢 B", f:"UPPER", ex:["上斜哑铃卧推","引体向上 / 辅助引体","单臂哑铃划船","侧平举","锤式弯举","俯卧撑"]},
    {n:"Day 4 · 下肢 B", f:"LOWER", ex:["腿举","臀推","保加利亚分腿蹲","腿屈伸","平板支撑 3×40秒"]}
  ],
  5:[
    {n:"Day 1 · 推", f:"PUSH", ex:["杠铃 / 哑铃卧推","上斜哑铃卧推","哑铃肩推","侧平举","绳索下压"]},
    {n:"Day 2 · 拉", f:"PULL", ex:["高位下拉","坐姿划船","单臂哑铃划船","面拉","哑铃弯举"]},
    {n:"Day 3 · 腿", f:"LEGS", ex:["深蹲","罗马尼亚硬拉","腿举","腿弯举","提踵"]},
    {n:"Day 4 · 上肢", f:"UPPER", ex:["器械推胸","引体向上 / 辅助引体","阿诺德推举","绳索划船","超级组：弯举 + 下压"]},
    {n:"Day 5 · 下肢 + 核心", f:"LOWER", ex:["臀推","保加利亚分腿蹲","腿屈伸","悬垂举腿","平板支撑 3×40秒"]}
  ]
};
const FIT_RULES = {
  build:{main:"4 组 × 6–10 次", acc:"3 组 × 10–12 次", rest:"90–120 秒", extra:"每周加重量或次数", cardio:"每周 2 次 · 20 分钟快走", steps:"7,000+ 步/天"},
  burn: {main:"3 组 × 10–12 次", acc:"3 组 × 12–15 次", rest:"45–60 秒", extra:"重量不掉，休息缩短", cardio:"每次训练后 15–20 分钟", steps:"8,000–10,000 步/天"}
};
function mapGoal(g){ return (g==="gain"||g==="keepGain") ? "build" : (g ? "burn" : null); }

function fitQuiz(){
  const st = S.fit.step;
  const isGoal = st===0;
  const opts = isGoal ? FIT_GOALS : DAYS;
  const cur = isGoal ? S.fit.goal : S.fit.days;
  return `
  <div class="bar"><i style="width:${st*50}%"></i></div>
  ${st>0 ? `<button class="back" data-fback>← 上一题</button>` : ""}
  <div>
    <div class="step-k num">问题 ${st+1} / 2</div>
    <div class="q">${isGoal ? "训练目标？" : "每周能练几天？"}</div>
    <p class="hint">${isGoal ? "选一个主要目标。" : "选你真的做得到的，坚持比天数重要。"}</p>
  </div>
  <div class="opts">${opts.map(o=>`<button class="opt ${cur==o.v?"on":""}" data-fpick="${o.v}">${o.t}<span>${o.s}</span></button>`).join("")}</div>`;
}

function fitPlan(){
  const R = FIT_RULES[S.fit.goal];
  const split = SPLITS[S.fit.days];
  const gT = FIT_GOALS.find(x=>x.v===S.fit.goal).t;
  return `
  <button class="back" data-go="fitq">← 修改选择</button>
  <section class="target">
    <div class="k">训练计划</div>
    <div class="big">${S.fit.days}<small>天 / 周</small></div>
    <div class="math">${gT} · 每次约 45–60 分钟</div>
  </section>
  <div class="rules">
    <div><span>主动作（每天前 2 个）</span><b>${R.main}</b></div>
    <div><span>辅助动作</span><b>${R.acc}</b></div>
    <div><span>组间休息</span><b>${R.rest}</b></div>
    <div><span>进步方式</span><b>${R.extra}</b></div>
    <div><span>有氧</span><b>${R.cardio}</b></div>
    <div><span>每日步数</span><b>${R.steps}</b></div>
  </div>
  <div class="sec-h"><h3>每周课表</h3></div>
  <div class="wk">${split.map((d,i)=>`
    <div class="wd"><div class="wd-h"><b>${d.n}</b><span>${d.f}</span></div>
      <ul class="ex">${d.ex.map((e,j)=>`<li>${esc(e)}<em>${/×/.test(e)?"":(j<2?R.main.replace(/ /g,""):R.acc.replace(/ /g,""))}</em></li>`).join("")}</ul></div>`).join("")}</div>
  <ul class="guide">
    <li>每次先热身 5–8 分钟：快走 + 动态拉伸</li>
    <li>最后 2 次要「有点吃力但姿势不跑」，才是对的重量</li>
    <li><b>训练后 30 分钟内喝 RS Pro Whey</b>，帮助肌肉恢复</li>
    <li>训练日之间至少隔一天休息同一部位，睡够 7 小时</li>
  </ul>
  <div class="actions">
    <button class="cta" data-copy="fit">复制课表发给学员</button>
    ${S.a.goal ? `<button class="cta alt" data-go="plan">← 回到餐单</button>` : `<button class="cta alt" data-go="quiz">去算我的餐单 →</button>`}
  </div>`;
}

/* ============ 复制文字（WhatsApp 格式） ============ */
function mealText(){
  const a=S.a, r=calc(), g=GOALS[a.goal];
  const pl = k => { const p=PORTION[k]; return [p.rice, p.pro, p.veg].filter(Boolean).join(" / "); };
  const milk = S.shake.milk ? "（只用低脂牛奶冲泡）" : "（清水冲泡）";
  let t = `🔥 *BurnUp 一日餐单*\n目标：${g.t}\n每日摄入：*${r.target} kcal*（TDEE ${r.tdee} ${r.adj>0?"+":""}${r.adj}）\n\n`;
  t += `🥤 *早餐 07:30* — ${r.shakeK} kcal\n${shakeText()}${milk}\n\n`;
  t += `🍱 *午餐 12:30* — ${r.L} kcal\n${pl(r.L)}\n\n`;
  t += `🥤 *下午茶 16:00* — ${r.shakeK} kcal\n${shakeText()}${milk}\n\n`;
  if(S.training) t += `💪 *训练后* — ${WHEY} kcal\nRS Pro Whey 蛋白\n\n`;
  t += `🍽 *晚餐 19:00* — ${r.D} kcal\n${pl(r.D)}\n\n`;
  r.extras.forEach(e => t += `➕ *加餐 21:00* — ${e.k} kcal\n${e.t}\n\n`);
  t += `碳水：白饭 / 糙米饭 / Soba / 土豆\n蛋白质：鸡肉 / 鱼肉 / 鸡蛋 / 瘦牛肉（素：豆腐 / Tempeh）\n蔬菜：各种绿色蔬菜\n\n`;
  t += `📏 1份蛋白质 = 一个手掌；1份蔬菜 = 两个拳头\n合计约 ${r.total} kcal`;
  return t;
}
function fitText(){
  const R=FIT_RULES[S.fit.goal], split=SPLITS[S.fit.days], gT=FIT_GOALS.find(x=>x.v===S.fit.goal).t;
  let t = `💪 *BurnUp 训练计划*\n${gT} · 每周 ${S.fit.days} 天\n主动作 ${R.main}｜辅助 ${R.acc}｜休息 ${R.rest}\n有氧：${R.cardio}｜步数：${R.steps}\n\n`;
  split.forEach(d => t += `*${d.n}*\n${d.ex.map(e=>"• "+e).join("\n")}\n\n`);
  t += `训练后 30 分钟内：RS Pro Whey 🥤`;
  return t;
}
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 1800);
}
function copy(text){
  const done = () => toast("已复制，去 WhatsApp 贴上");
  const fallback = () => {
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    ta.remove(); ok ? done() : toast("复制失败，请长按选取文字");
  };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); }
  else fallback();
}

/* ============ 交互 ============ */
function next(){
  if(S.step < STEPS.length-1){ S.step++; S.view="quiz"; }
  else { S.view="plan"; S.fit.goal = S.fit.goal || mapGoal(S.a.goal); }
  render();
}
$app.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.go){
    const g=t.dataset.go;
    if(g==="quiz"){ S.step=0; S.view="quiz"; }
    else if(g==="quiz-edit"){ S.step=0; S.view="quiz"; }
    else if(g==="fitq"){ S.fit.step=0; if(!S.fit.goal) S.fit.goal=mapGoal(S.a.goal); S.view="fitq"; }
    else S.view=g;
    return render();
  }
  if("back" in t.dataset){ S.step=Math.max(0,S.step-1); return render(); }
  if(t.dataset.pick !== undefined){
    const st=STEPS[S.step]; const raw=t.dataset.pick;
    S.a[st.key] = st.key==="activity" ? parseFloat(raw) : raw;
    return next();
  }
  if("train" in t.dataset){ S.training=!S.training; return render(); }
  if(t.dataset.shake){ const id=t.dataset.shake; if(id!=="f1"){ S.shake[id]=!S.shake[id]; render(); } return; }
  if(t.dataset.copy){ return copy(t.dataset.copy==="meal" ? mealText() : fitText()); }
  if(t.dataset.fpick){
    if(S.fit.step===0){ S.fit.goal=t.dataset.fpick; S.fit.step=1; S.view="fitq"; }
    else { S.fit.days=parseInt(t.dataset.fpick,10); S.view="fit"; }
    return render();
  }
  if("fback" in t.dataset){ S.fit.step=0; return render(); }
});
$app.addEventListener("submit", e=>{
  e.preventDefault();
  const st=STEPS[S.step]; const inp=e.target.querySelector("input");
  const v=parseFloat(inp.value);
  if(isNaN(v) || v<st.min || v>st.max){
    document.getElementById("err").textContent=`请输入 ${st.min}–${st.max} ${st.unit} 之间的数字`;
    return;
  }
  S.a[st.key] = st.dec ? Math.round(v*10)/10 : Math.round(v);
  next();
});

render();
</script>
</body>
</html>
