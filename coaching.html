<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BurnUp Coach</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<meta name="theme-color" content="#050505" />
<meta name="description" content="BurnUp × Herbalife Coaching — 80% Nutrition + 20% Fitness. 每日热量、一日餐单、训练课表。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23F5B800' d='M14.5 1 4 13.5h6.2L8.5 23 20 9.8h-6.3z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,800;1,800;1,900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" />
<style id="app-style">
/* Layout: mobile app column on black with gold light streaks. Home = 80% nutrition card + 20% fitness strip. Single dark theme by choice (brand); print = clean white. */
:root{
  --bg:#050505;
  --panel:#121110;
  --line:#2B2720;
  --fg:#F6F3EC;
  --muted:#A09887;
  --gold:#F5B800;       /* BurnUp gold */
  --gold-hi:#FFD966;
  --gold-lo:#C98A00;
  --ink:#1A1200;        /* text on gold */
  --good:#46D98A;
  --warn:#FFB020;
  --danger:#FF7B6B;
  --en:"Montserrat","Avenir Next","Segoe UI",system-ui,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:"Montserrat","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 40% at -10% 8%, rgba(245,184,0,.22), transparent 55%),
    radial-gradient(90% 30% at 110% 95%, rgba(245,184,0,.18), transparent 60%),
    radial-gradient(60% 12% at -5% 30%, rgba(255,170,40,.12), transparent 70%);}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.en{font-family:var(--en);letter-spacing:.02em}
.gold-text{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.print-only{display:none}

/* header + logo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:2px;background:none;border:0;padding:0;text-align:left}
.logo svg{width:26px;height:34px;flex:none}
.wm{display:grid;line-height:1}
.wm b{font-family:var(--en);font-weight:300;font-size:22px;letter-spacing:-.01em;color:var(--fg)}
.wm b strong{font-weight:500}
.wm i{font-family:var(--en);font-weight:900;font-style:italic;font-size:10px;letter-spacing:.06em;color:var(--fg);margin-left:22px;margin-top:-1px}
.pill{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.badge{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--ink);background:var(--gold);border-radius:4px;padding:3px 6px}

/* role switch */
.roles{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.roles button{border:0;background:none;border-radius:9px;padding:9px 8px;font-size:14px;font-weight:700;color:var(--muted);line-height:1.3}
.roles button small{display:block;font-size:11px;font-weight:500;font-family:var(--zh)}
.roles button.on{background:var(--gold);color:var(--ink)}

/* hero */
.hero{text-align:center;display:grid;gap:8px;padding-top:6px}
.hero h1{margin:0;font-family:var(--en);font-weight:900;font-style:italic;font-size:clamp(28px,8.4vw,42px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.hero h1 .x{font-style:normal;font-weight:300;color:var(--gold);margin:0 .12em}
.hero .zh{font-family:var(--zh);font-weight:900;font-size:clamp(20px,5.6vw,26px);letter-spacing:.06em}
.swoosh{display:block;margin:-4px auto 0;width:58%;height:10px}
.tft{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--en);font-weight:800;font-style:italic;font-size:12px;letter-spacing:.26em}
.tft i{color:var(--gold);font-style:normal}
.tft::before,.tft::after{content:"";flex:1;max-width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--muted))}
.tft::after{transform:scaleX(-1)}

/* 80 / 20 */
.split{display:grid;gap:12px}
.split-k{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.split-k span:first-child{color:var(--gold)}
.ratio{display:flex;height:6px;border-radius:6px;overflow:hidden;gap:3px}
.ratio i{background:var(--gold);flex:4}
.ratio i+i{background:var(--line);flex:1}
.nutri{position:relative;overflow:hidden;border-radius:18px;padding:22px 20px 20px;color:var(--ink);
  background:linear-gradient(150deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);display:grid;gap:16px;min-height:340px;align-content:space-between}
.nutri .bolt-bg{position:absolute;right:-24px;top:-6px;width:180px;opacity:.18}
.nutri .bolt-bg svg{width:100%;height:auto}
.nutri .k{font-size:11px;font-weight:800;letter-spacing:.16em}
.nutri h2{margin:4px 0 0;font-family:var(--en);font-weight:900;font-style:italic;font-size:34px;line-height:1}
.nutri h2 small{display:block;font-family:var(--zh);font-style:normal;font-size:22px;font-weight:900;margin-top:6px}
.nutri ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;font-weight:700;position:relative}
.nutri li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nutri li::before{content:"";flex:none;width:7px;height:7px;transform:rotate(45deg) translateY(-1px);background:var(--ink)}
.nutri li span{opacity:.75;font-family:var(--zh);font-weight:500}
.btn-ink{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--ink);color:var(--gold-hi);border:0;border-radius:12px;padding:15px 18px;font-weight:800;font-size:16px;position:relative}
.btn-ink small{font-family:var(--zh);font-weight:700;color:var(--fg);margin-left:6px}
.link-ink{background:none;border:0;padding:2px 0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px;justify-self:start;position:relative}
.fit-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.fit-strip:hover{border-color:var(--gold)}
.fit-strip .k{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--gold)}
.fit-strip b{display:block;font-size:16px}
.fit-strip b small{font-family:var(--zh);font-weight:700;margin-left:6px;color:var(--muted)}
.fit-strip .go{color:var(--gold);font-size:22px;font-weight:800}
.foot{font-size:11px;color:var(--muted);text-align:center;margin:0}

/* quiz */
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .3s}
.step-k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.14em}
.q{margin:6px 0 4px;line-height:1.15}
.q .en{display:block;font-weight:900;font-style:italic;font-size:clamp(28px,8vw,38px)}
.q .zh{display:block;font-family:var(--zh);font-weight:700;font-size:20px;color:var(--gold);margin-top:4px}
.hint{color:var(--muted);margin:0;font-size:13px;font-family:var(--zh)}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700}
.opt .zh{font-family:var(--zh);font-weight:700;margin-left:6px}
.opt span.s{font-weight:400;font-size:12px;color:var(--muted);font-family:var(--zh);text-align:right}
.opt:hover,.opt.on{border-color:var(--gold)}
.opt.on{background:rgba(245,184,0,.1)}
.field{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font-family:var(--en);font-weight:800;font-size:56px;line-height:1.1;padding:0;outline:none}
.field input.txt{font-size:30px;font-family:var(--zh)}
.field input.sm{font-size:22px}
.field input::placeholder{color:#3b352b}
.field .u{color:var(--muted);font-size:16px;font-weight:700}
.err{color:var(--warn);font-size:13px;min-height:1.2em;margin:6px 0 0;font-family:var(--zh)}
.cta{display:block;width:100%;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:800;letter-spacing:.02em}
.cta small{font-family:var(--zh);font-weight:700;margin-left:6px;font-size:15px}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:4px 0;font-size:13px}

/* result */
.who{font-size:13px;color:var(--muted);font-family:var(--zh)}
.who b{color:var(--fg)}
.client{font-family:var(--zh);font-size:24px;font-weight:900;margin:0}
.target{background:linear-gradient(150deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));color:var(--ink);border-radius:16px;padding:18px 20px;display:grid;gap:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.target .k{font-size:11px;font-weight:800;letter-spacing:.16em}
.target .k span{font-family:var(--zh);letter-spacing:.04em;margin-left:6px}
.target .big{font-family:var(--en);font-weight:900;font-style:italic;font-size:clamp(60px,18vw,88px);line-height:1}
.target .big small{font-size:.28em;font-style:normal;font-weight:800;margin-left:6px}
.target .math{font-size:12px;font-weight:500;opacity:.85;font-family:var(--zh)}
.note{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-family:var(--zh)}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:6px 0 -6px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.sec-h span{font-family:var(--zh);font-size:13px;color:var(--muted)}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.toggle b{display:block;font-size:15px}
.toggle b small{font-family:var(--zh);margin-left:6px}
.toggle span{font-size:12px;color:var(--muted);font-family:var(--zh)}
.sw{flex:none;width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--gold)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(20px)}

.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:grid;gap:10px}
.box p{margin:0;font-size:13px;color:var(--muted);font-family:var(--zh)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:13px;color:var(--muted);font-weight:600}
.chip.on{border-color:var(--gold);color:var(--fg);background:rgba(245,184,0,.12)}
.chip.lock{cursor:default}
.chip i{font-style:normal;font-size:11px;margin-left:4px;opacity:.75}

.day{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}
.meal{position:relative;padding:0 0 18px 20px;break-inside:avoid}
.meal:last-child{padding-bottom:0}
.meal::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.meal.fixed::before{background:var(--gold)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meal-h .t{font-size:12px;color:var(--muted);font-weight:700}
.meal-h h4{margin:0;font-size:17px;font-weight:800}
.meal-h h4 small{font-family:var(--zh);font-weight:700;font-size:15px;margin-left:6px}
.meal-h .kc{font-family:var(--en);font-weight:900;font-style:italic;font-size:24px;color:var(--gold);white-space:nowrap}
.meal-h .kc small{font-size:11px;font-style:normal;color:var(--muted);margin-left:2px;font-weight:700}
.meal .what{margin:4px 0 0;font-size:14px}
.meal .sub{margin:2px 0 0;font-size:12px;color:var(--muted);font-family:var(--zh)}
.meal .chips{margin-top:8px}
.plate{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plate span{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-family:var(--zh)}
.plate span b{color:var(--gold);font-weight:700}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum div{background:var(--panel);padding:12px;display:grid;gap:2px}
.sum span{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.sum b{font-family:var(--en);font-weight:900;font-style:italic;font-size:24px;line-height:1.1}

.menu{display:grid;gap:10px}
.menu div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;break-inside:avoid}
.menu h5{margin:0 0 4px;font-size:12px;letter-spacing:.1em;color:var(--gold);font-weight:800}
.menu h5 span{font-family:var(--zh);letter-spacing:0;margin-left:6px}
.menu p{margin:0;font-size:14px}
.guide{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:4px;font-family:var(--zh)}
.guide b{color:var(--fg)}
.actions{display:grid;gap:10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.sbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 8px;font-size:13px;font-weight:700;text-align:center}
.sbtn small{display:block;font-family:var(--zh);font-weight:500;font-size:11px;color:var(--muted)}
.sbtn.danger{color:var(--danger)}
.sbtn.danger.arm{background:var(--danger);color:var(--ink);border-color:var(--danger)}
.sbtn.danger.arm small{color:var(--ink)}
textarea{width:100%;min-height:80px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:inherit;font-family:var(--zh);padding:12px;resize:vertical}
.notes-print{white-space:pre-wrap;font-family:var(--zh);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:20;font-family:var(--zh);max-width:calc(100% - 32px);text-align:center}

/* coach */
.login{display:grid;gap:14px;padding-top:12px}
.login h2{margin:0;font-weight:900;font-style:italic;font-size:30px;line-height:1.1}
.login h2 small{display:block;font-family:var(--zh);font-style:normal;font-size:18px;color:var(--gold);margin-top:4px}
.dash-h h2{margin:0;font-weight:900;font-style:italic;font-size:28px;line-height:1}
.dash-h h2 small{display:block;font-family:var(--zh);font-style:normal;font-size:15px;color:var(--muted);margin-top:6px;font-weight:700}
.list{display:grid;gap:8px}
.stu{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stu:hover{border-color:var(--gold)}
.stu > div{min-width:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:900;font-family:var(--zh)}
.stu b{display:block;font-family:var(--zh);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu span{font-size:12px;color:var(--muted);font-family:var(--zh)}
.stu .kc{font-weight:900;font-style:italic;color:var(--gold);font-size:18px;text-align:right;line-height:1.1}
.stu .kc small{display:block;font-size:10px;color:var(--muted);font-style:normal;font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-family:var(--zh);font-size:14px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--fg);font:inherit;font-family:var(--zh)}

/* fitness */
.wk{display:grid;gap:12px}
.wd{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;break-inside:avoid}
.wd-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.wd-h b{font-size:15px}
.wd-h b small{font-family:var(--zh);margin-left:6px}
.wd-h span{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.12em}
.ex{list-style:none;margin:0;padding:6px 14px 10px}
.ex li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ex li:last-child{border-bottom:0}
.ex li small{font-family:var(--zh);color:var(--muted);margin-left:6px}
.ex li em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;font-weight:700}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rules div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.rules span{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.rules b{font-size:14px;font-family:var(--zh)}

/* print / PDF + downloaded file */
.print-head{align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:10px}
.print-head .t{font-size:12px;color:var(--muted);text-align:right;font-family:var(--zh)}
.snapshot .print-only{display:flex}
.snapshot .notes-print.print-only{display:block}
@media print{
  :root{--bg:#fff;--panel:#fff;--line:#d9d3c4;--fg:#111;--muted:#5b5446;--gold:#B98300;--gold-hi:#F5C842;--gold-lo:#C98A00;color-scheme:light}
  body{padding:0}
  .glow,.noprint,.toast{display:none!important}
  .print-only{display:flex!important}
  .notes-print.print-only{display:block!important}
  .app{max-width:none;padding:0;gap:12px}
  .wm b,.wm i{color:#111}
  @page{margin:12mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden />

<script>
/* ================= 品牌元素 ================= */
const BOLT = id => `<svg viewBox="0 0 24 32" aria-hidden="true"><defs><linearGradient id="bolt-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset=".5" stop-color="#F5B800"/><stop offset="1" stop-color="#A86F00"/></linearGradient></defs><path fill="url(#bolt-${id})" d="M17 0 3 18h8.2L7.5 32 22 12.6h-8.3z"/></svg>`;
const LOGO = id => `${BOLT(id)}<span class="wm"><b>Burn<strong>UP</strong></b><i>COACHING</i></span>`;

/* ================= 公式与选项 ================= */
const ACT = [
  {v:1.2,  en:"Sedentary",  zh:"久坐",    s:"办公室，几乎不运动"},
  {v:1.375,en:"Light",      zh:"轻度活动", s:"每周运动 1–3 次"},
  {v:1.55, en:"Moderate",   zh:"中度活动", s:"每周运动 3–5 次"},

  lose:    {en:"Fat Loss",        zh:"减脂减重",       s:"想掉秤、瘦下来"},

  keepGain:{en:"Recomp · Muscle", zh:"维持体重 · 增肌", s:"体重不变，肌肉增加"}
};
function adjust(goal, age){
  const over40 = age >= 40;
  if(goal==="gain") return over40 ? 300 : 500;
  if(goal==="lose") return over40 ? -300 : -500;
  if(goal==="keepLose") return -200;
  if(goal==="keepGain") return 200;
  return 0;
}
const bmr = a => 10*a.weight + 6.25*a.height - 5*a.age + (a.gender==="m" ? 5 : -161); // Mifflin-St Jeor

async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt + ":" + pin);
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let h = 5381; for(const b of data) h = ((h<<5) + h + b) >>> 0; return "x" + h.toString(16);
}

/* ================= 计算 ================= */
function calc(rec){
  const a = rec.a;
  const tdee = Math.round(bmr(a) * a.activity);
  const adj = adjust(a.goal, a.age);
  let target = tdee + adj, floored = false;
  if(target < FLOOR[a.gender]){ target = FLOOR[a.gender]; floored = true; }
  target = Math.round(target/10)*10;

  const big = target > SNACK_LINE;
  const shake = Object.assign({}, rec.shake); if(big) shake.milk = true;   // 高热量：奶昔先固定加牛奶
  const shakeK = SHAKE_ITEMS.reduce((s,i)=> s + (shake[i.id] ? i.k : 0), 0);
  const fixed = shakeK*2 + (rec.training ? WHEY : 0);
  const remaining = target - fixed;

  const slot = ov => {
    if(!big || ov === "none") return [null];
    if(ov) return [SNACKS.find(s=>s.id===ov) || null];
    return [null, ...SNACKS];
  };
  let best = null;
  for(const L of LUNCH) for(const D of DINNER) for(const am of slot(rec.snacks.am)) for(const pm of slot(rec.snacks.pm)){
    const sum = L + D + (am?am.k:0) + (pm?pm.k:0);
    // 先用正餐填满，还不够才加餐；同分时偏向午餐 ≥ 晚餐
    const score = Math.abs(sum - remaining) + (D > L ? 30 : 0) + (am ? 40 : 0) + (pm ? 40 : 0);
    if(!best || score < best.score) best = {L, D, am, pm, score};
  }
  const total = fixed + best.L + best.D + (best.am?best.am.k:0) + (best.pm?best.pm.k:0);
  const diff = total - target;
  return {tdee, adj, target, floored, big, shake, shakeK, L:best.L, D:best.D, am:best.am, pm:best.pm, total, diff,
    tooLow: diff >= 150, tooHigh: diff <= -300};
}

  t += `🥤 *Afternoon Shake 下午茶 16:00* — ${r.shakeK} kcal\n${sh}\n\n`;

  t += `🍽 *Dinner 晚餐 19:00* — ${r.D} kcal\n${pl(r.D)}\n\n`;
  if(r.big) t += `🍌 *Evening Snack 晚餐后加餐 21:00* — ${sn(r.pm)}\n\n`;
  t += `Carbs 碳水：白饭 / 糙米饭 / Soba / 土豆\nProtein 蛋白质：鸡肉 / 鱼肉 / 鸡蛋 / 瘦牛肉（素：豆腐 / Tempeh）\nVeg 蔬菜：各种绿色蔬菜\n📏 1 份蛋白质 = 一个手掌；1 份蔬菜 = 两个拳头\n\nTotal 合计约 ${r.total} kcal`;

}
function fitText(){
  const f=S.rec.fit, R=FIT_RULES[f.goal], G=FIT_GOALS.find(x=>x.v===f.goal);

/* ================= PDF / 下载 / 复制 ================= */
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2400); }
function copy(text){
  const done = () => toast("已复制，去 WhatsApp 贴上");
  const fallback = () => {
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    ta.remove(); ok ? done() : toast("复制失败，请长按选取文字");
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
const fileBase = () => `BurnUp_${(S.rec.name || "MyPlan").replace(/[^\w一-龥-]+/g,"_")}_${S.view==="fit"?"Training":"MealPlan"}_${new Date().toISOString().slice(0,10)}`;
function downloadBlob(content, type, filename){
  try{
    const url = URL.createObjectURL(new Blob([content], {type}));
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast("已下载 " + filename);
  }catch(e){ toast("这个浏览器不支持下载，请用 PDF 或复制文字"); }
}
function pdf(){
  const old = document.title; document.title = fileBase();
  toast("打印窗口选「Save as PDF / 存为 PDF」");
  setTimeout(()=>{ window.print(); setTimeout(()=>document.title = old, 500); }, 300);
}
function snapshot(){
  const node = document.getElementById("app").cloneNode(true);
  node.querySelectorAll(".noprint").forEach(n=>n.remove());
  const css = document.getElementById("app-style").textContent;
  const html = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(fileBase())}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,800;1,800;1,900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>${css}</style></head><body class="snapshot"><div class="glow"></div><div class="app">${node.innerHTML}</div></body></html>`;
  downloadBlob(html, "text/html;charset=utf-8", fileBase() + ".html");
}

/* ================= 流程 ================= */
function finishQuiz(){
  S.rec.snacks = {am:null, pm:null};
  if(!S.rec.fit.goal) S.rec.fit.goal = mapGoal(S.rec.a.goal);
  if(isCoach() && !S.rec.id){ S.rec.id = "s" + Date.now().toString(36); S.rec.created = Date.now(); }
  saveRec(); go("plan");
}
function nextStep(){ if(S.step < quizSteps().length-1){ S.step++; go("quiz"); } else finishQuiz(); }
function startFit(){ if(!S.rec.fit.goal) S.rec.fit.goal = mapGoal(S.rec.a.goal); S.fitStep = 0; go("fitq"); }

$app.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;

  if(d.go){
    if(d.go==="home" && !isCoach()) S.rec = selfRec();
    if(d.go==="home" && isCoach()) S.rec = blankRec();
    return go(d.go);
  }
  if(d.role){
    S.role = d.role; SS.set("bu_role", d.role);
    if(d.role==="coach"){ S.rec = blankRec(); return go(S.authed ? "home" : "login"); }
    S.rec = selfRec(); return go("home");
  }
  if("logout" in d){ S.authed=false; SS.del("bu_auth"); S.role="student"; SS.set("bu_role","student"); S.rec=selfRec(); return go("home"); }
  if("reset" in d){
    if(!S.arm){ S.arm=true; return render(); }
    LS.del(K_PIN); LS.del(K_STU); S.arm=false; toast("已清空，请重新设置 PIN"); return render();
  }
  if("start" in d){ if(!isCoach()) S.rec = selfRec(); S.step=0; return go("quiz"); }
  if("myplan" in d){ S.rec = selfRec(); return go("plan"); }
  if("new" in d){ S.rec = blankRec(); S.step=0; return go("quiz"); }
  if(d.open){ const s = students().find(x=>x.id===d.open); if(!s) return; S.rec = normalize(s); S.step=0; return go(planReady(S.rec) ? "plan" : "quiz"); }
  if("fit" in d) return startFit();
  if("back" in d){ S.step=Math.max(0,S.step-1); return go("quiz"); }
  if("edit" in d){ S.step=0; return go("quiz"); }
  if(d.pick !== undefined){
    const st = quizSteps()[S.step];
    S.rec.a[st.key] = st.key==="activity" ? parseFloat(d.pick) : d.pick;
    return nextStep();
  }
  if("train" in d){ S.rec.training=!S.rec.training; saveRec(); return render(); }
  if(d.shake){
    if(t.getAttribute("aria-disabled")) return;
    S.rec.shake[d.shake]=!S.rec.shake[d.shake]; saveRec(); return render();
  }
  if(d.snack){ const [slot,id]=d.snack.split(":"); S.rec.snacks[slot]=id; saveRec(); return render(); }
  if(d.copy) return copy(d.copy==="meal" ? mealText() : fitText());
  if("pdf" in d) return pdf();
  if("dl" in d) return snapshot();
  if("del" in d){
    if(!S.arm){ S.arm=true; return render(); }
    LS.set(K_STU, students().filter(x=>x.id!==S.rec.id)); toast("已删除 " + (S.rec.name||"")); S.rec=blankRec(); return go("home");
  }
  if("export" in d){
    const data = {app:"burnup-coach", version:1, exported:new Date().toISOString(), students:students()};
    return downloadBlob(JSON.stringify(data, null, 2), "application/json", `BurnUp_Students_Backup_${new Date().toISOString().slice(0,10)}.json`);
  }
  if("import" in d) return document.getElementById("importFile").click();
  if(d.fpick){
    if(S.fitStep===0){ S.rec.fit.goal=d.fpick; S.fitStep=1; return go("fitq"); }
    S.rec.fit.days=parseInt(d.fpick,10); saveRec(); return go("fit");
  }
  if("fback" in d || "refit" in d){ S.fitStep=0; return go("fitq"); }
});

$app.addEventListener("submit", async e=>{
  e.preventDefault();
  const err = document.getElementById("err");
  if(e.target.id==="loginf"){
    const p1 = document.getElementById("pin1").value.trim();
    const stored = LS.get(K_PIN, null);
    if(!/^\d{4,8}$/.test(p1)){ err.textContent="PIN 要 4–8 位数字"; return; }
    if(stored){
      if(await hashPin(p1, stored.salt) !== stored.hash){ err.textContent="PIN 不正确"; return; }
    } else {
      if(p1 !== document.getElementById("pin2").value.trim()){ err.textContent="两次输入不一样"; return; }
      const salt = Math.random().toString(36).slice(2);
      if(!LS.set(K_PIN, {salt, hash: await hashPin(p1, salt)})){ err.textContent="这个浏览器不能保存资料（可能是无痕模式）"; return; }
    }
    S.authed = true; SS.set("bu_auth","1"); S.rec = blankRec(); return go("home");
  }
  const st = quizSteps()[S.step];
  const raw = e.target.querySelector("input").value;
  if(st.type==="text"){
    const v = raw.trim(); if(!v){ err.textContent="请输入学员名字"; return; }
    S.rec.name = v; return nextStep();
  }
  const v = parseFloat(raw);
  if(isNaN(v) || v<st.min || v>st.max){ err.textContent=`请输入 ${st.min}–${st.max} 之间的数字`; return; }
  S.rec.a[st.key] = st.dec ? Math.round(v*10)/10 : Math.round(v);
  nextStep();
});

$app.addEventListener("input", e=>{
  if(e.target.id==="note"){ S.rec.note = e.target.value; clearTimeout(saveRec._t); saveRec._t=setTimeout(saveRec, 400); }
  if(e.target.id==="search"){
    S.q = e.target.value; const pos=e.target.selectionStart; render();
    const s=document.getElementById("search"); if(s){ s.focus(); s.setSelectionRange(pos,pos); }
  }
});

document.getElementById("importFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      const inc = Array.isArray(data) ? data : data.students;
      if(!Array.isArray(inc)) throw 0;
      const list = students(); let n=0;
      inc.forEach(s=>{ if(!s || !s.id) return; const i=list.findIndex(x=>x.id===s.id); if(i>=0) list[i]=s; else list.push(s); n++; });
      LS.set(K_STU, list); toast(`已导入 ${n} 位学员`); render();
    }catch(_){ toast("文件格式不对，请选 BurnUp 备份 .json"); }
    e.target.value="";
  };
  rd.readAsText(f);
});

if(S.role==="coach"){ S.rec = blankRec(); S.view = S.authed ? "home" : "login"; }
render();
</script>
</body>
</html>
