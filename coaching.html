<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BurnUp Coach</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="BurnUp Coaching — 80% nutrition + 20% training. Meal plan and coach-designed workouts in 简体中文, 繁體中文, English and Bahasa Melayu." />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BurnUp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" />
<style id="app-style">
/* Layout: full-width black nav; centered hero over dimmed phone frames; 80/20 grid (nutrition / coach-only training); tools in a 640px column. Single dark theme by choice; print = clean white. */
:root{
  --bg:#000000;
  --panel:#0D0D0D;
  --panel-2:#161616;
  --line:#242424;
  --fg:#FFFFFF;
  --muted:#9A9A9A;
  --yellow:#FFD000;          /* BurnUp yellow */
  --yellow-2:#FFB800;
  --ink:#0A0A0A;             /* text on yellow */
  --good:#3DDC84;
  --warn:#FFB020;
  --danger:#FF6B5B;
  --grad:linear-gradient(135deg,#000 0%,#1a1400 42%,#7a5c00 78%,#FFD000 120%);
  --grad-y:linear-gradient(180deg,#FFE15A 0%,#FFD000 50%,#FFB800 100%);
  --head:"Inter Tight","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --body:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.zh{font-family:var(--zh)}
.print-only{display:none!important}
.gy{background:var(--grad-y);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- nav ---------- */
.nav{border-bottom:1px solid var(--line);background:var(--bg)}
.nav-in,.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--fg)}
.logo svg{width:20px;height:28px;flex:none}
.logo .wm{display:grid;line-height:.95;text-align:left}
.logo .wm b{font-family:var(--head);font-weight:800;font-size:21px;letter-spacing:-.03em}
.logo .wm i{font-style:normal;font-family:var(--head);font-weight:600;font-size:9px;letter-spacing:.32em;color:var(--yellow)}
.nav-r{display:flex;align-items:center;gap:8px}
.nlink{background:none;border:0;padding:8px 10px;font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.nbtn{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);border:0;border-radius:10px;padding:10px 16px;font-family:var(--head);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.badge{font-family:var(--head);font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--ink);background:var(--yellow);border-radius:4px;padding:4px 7px}

main{padding-block:28px 64px}
.narrow{max-width:680px}
#view{display:flex;flex-direction:column;gap:18px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:10px;padding:16px 22px;font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;border:0;text-align:center}
.btn .zh{font-weight:700;letter-spacing:0;text-transform:none;opacity:.8}
.btn-y{background:var(--yellow);color:var(--ink)}
.btn-y:hover{background:#FFDC33}
.btn-o{background:transparent;color:var(--fg);border:1.5px solid #3a3a3a}
.btn-o:hover{border-color:var(--fg)}
.btn-k{background:var(--ink);color:var(--fg)}
.btn.block{display:flex;width:100%}
.arrow{width:16px;height:16px;flex:none}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:4px 0;font-size:13px;font-weight:600}
.back:hover{color:var(--fg)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;background:#050505;border:1px solid var(--line);isolation:isolate}
.hero::after{content:"";position:absolute;inset:auto -10% -55% -10%;height:90%;background:radial-gradient(50% 50% at 50% 50%,rgba(255,208,0,.38),rgba(255,184,0,.08) 55%,transparent 72%);z-index:-1}
.phones{position:absolute;inset:0;display:flex;justify-content:center;gap:28px;align-items:flex-start;padding-top:36px;z-index:-2;opacity:.22;pointer-events:none}
.phone{flex:none;width:190px;height:390px;border-radius:34px;border:6px solid #2a2a2a;background:#111;padding:44px 14px 14px;display:grid;align-content:start;gap:10px;position:relative}
.phone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:64px;height:18px;border-radius:12px;background:#000}
.phone:nth-child(2n){margin-top:60px}
.phone i{display:block;height:10px;border-radius:5px;background:#333}
.phone i.w6{width:60%}.phone i.w8{width:80%}
.phone .card{height:110px;border-radius:14px;background:var(--grad)}
.phone .card.y{background:var(--grad-y)}
.phone .row{display:flex;gap:8px;align-items:center}
.phone .dot{width:22px;height:22px;border-radius:50%;background:#333;flex:none}
.hero-in{position:relative;text-align:center;padding:72px 22px 64px;display:grid;justify-items:center;gap:22px;background:radial-gradient(70% 60% at 50% 40%,rgba(0,0,0,.85),rgba(0,0,0,.55) 70%,transparent)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid #333;border-radius:999px;padding:6px 14px;font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--fg);background:rgba(0,0,0,.6)}
.eyebrow svg{width:10px;height:14px}
.hero h1{margin:0;font-family:var(--head);font-weight:800;display:grid;justify-items:center;line-height:.88}
.hero h1 .b1{font-size:clamp(68px,16vw,160px);letter-spacing:-.06em}
.hero h1 .b2{font-size:clamp(34px,7.4vw,72px);letter-spacing:-.045em;margin-top:.12em;padding-bottom:.08em}
.with{font-family:var(--head);font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.with b{color:#d8d8d8;font-weight:700}
.hero .sub{margin:0;max-width:44ch;font-size:clamp(16px,2.2vw,20px);line-height:1.5;color:#E6E6E6}
.hero .sub span{display:block;font-family:var(--zh);font-size:.82em;color:var(--muted);margin-top:6px}
.checks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;margin:0;padding:0;list-style:none}
.checks li{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.checks li small{font-family:var(--zh);color:var(--muted);font-size:13px}
.ck{width:18px;height:18px;flex:none}
.hero-cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}

/* ---------- 80/20 ---------- */
.sec-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:40px}
.sec-title h2{margin:0;font-family:var(--head);font-weight:800;font-size:clamp(28px,5vw,44px);letter-spacing:-.035em;line-height:1.05}
.sec-title h2 small{display:block;font-family:var(--zh);font-size:.5em;color:var(--muted);letter-spacing:0;font-weight:700;margin-top:8px}
.ratio{display:flex;height:6px;border-radius:6px;overflow:hidden;gap:4px;margin-top:18px}
.ratio i{background:var(--grad-y);flex:4}
.ratio i+i{background:#2a2a2a;flex:1}
.ratio-k{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.ratio-k span:first-child{color:var(--yellow)}
.grid8020{display:grid;gap:14px;margin-top:20px}
@media (min-width:820px){.grid8020{grid-template-columns:4fr 1.15fr}}
.nutri{position:relative;overflow:hidden;border-radius:20px;background:var(--grad);border:1px solid #2b2400;padding:28px;display:grid;gap:26px;align-content:space-between;min-height:360px}
.nutri .bolt-bg{position:absolute;right:-30px;bottom:-40px;width:240px;opacity:.14;pointer-events:none}
.nutri .bolt-bg svg{width:100%;height:auto}
.k{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--yellow)}
.nutri h3{margin:8px 0 0;font-family:var(--head);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.02;letter-spacing:-.035em}
.nutri h3 small{display:block;font-family:var(--zh);font-size:.55em;font-weight:700;letter-spacing:0;color:#ddd;margin-top:8px}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
@media (min-width:600px){.feat{grid-template-columns:1fr 1fr}}
.feat li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.feat li small{display:block;font-family:var(--zh);font-weight:400;color:#cfc6a8;font-size:13px}
.nutri-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:relative}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--yellow)}
.fitcard{border-radius:20px;border:1px solid var(--line);background:var(--panel);padding:24px;display:grid;gap:14px;align-content:space-between;text-align:left;width:100%}
.fitcard h3{margin:6px 0 0;font-family:var(--head);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.05}
.fitcard h3 small{display:block;font-family:var(--zh);font-size:15px;color:var(--muted);letter-spacing:0;margin-top:6px}
.fitcard p{margin:0;color:var(--muted);font-size:13px;font-family:var(--zh)}
.lock{display:inline-flex;align-items:center;gap:6px;font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--fg);border:1px solid #333;border-radius:999px;padding:5px 10px;justify-self:start}
.lock svg{width:12px;height:12px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:36px 0 0}

/* ---------- quiz ---------- */
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad-y);transition:width .3s}
.step-k{font-family:var(--head);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.14em}
.q{margin:8px 0 2px}
.q b{display:block;font-family:var(--head);font-weight:800;font-size:clamp(34px,7vw,52px);letter-spacing:-.04em;line-height:1.02}
.q span{display:block;font-family:var(--zh);font-weight:700;font-size:20px;color:var(--yellow);margin-top:8px}
.hint{color:var(--muted);margin:0;font-size:14px;font-family:var(--zh)}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-family:var(--head);font-size:18px;font-weight:700;letter-spacing:-.01em}
.opt .zh{font-weight:700;margin-left:8px;font-size:16px}
.opt .s{font-family:var(--zh);font-weight:400;font-size:12px;color:var(--muted);text-align:right}
.opt:hover{border-color:#555}
.opt.on{border-color:var(--yellow);background:linear-gradient(90deg,rgba(255,208,0,.12),transparent)}
.field{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--yellow);padding-bottom:6px}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font-family:var(--head);font-weight:800;font-size:64px;letter-spacing:-.04em;line-height:1.1;padding:0;outline:none}
.field input.txt{font-size:34px;font-family:var(--zh);letter-spacing:0}
.field input.sm{font-size:22px;letter-spacing:0}
.field input::placeholder{color:#333}
.field .u{color:var(--muted);font-size:16px;font-weight:600}
.err{color:var(--warn);font-size:13px;min-height:1.2em;margin:8px 0 12px;font-family:var(--zh)}

/* ---------- plan ---------- */
.client{font-family:var(--head);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0}
.who{font-size:13px;color:var(--muted);font-family:var(--zh)}
.who b{color:var(--fg)}
.target{position:relative;overflow:hidden;border-radius:20px;background:var(--grad);border:1px solid #2b2400;padding:22px 24px;display:grid;gap:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.target .big{font-family:var(--head);font-weight:800;font-size:clamp(64px,17vw,104px);line-height:.95;letter-spacing:-.05em}
.target .big small{font-size:.24em;letter-spacing:0;color:var(--yellow);margin-left:8px;font-weight:700}
.target .math{font-size:13px;color:#d7d0b8;font-family:var(--zh)}
.note{border:1px solid rgba(255,176,32,.6);background:rgba(255,176,32,.06);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:13px;font-family:var(--zh)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:14px 0 -4px;flex-wrap:wrap}
.sec-h h3{margin:0;font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-.02em}
.sec-h span{font-family:var(--zh);font-size:14px;color:var(--muted)}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.toggle b{display:block;font-weight:700}
.toggle b small{font-family:var(--zh);margin-left:6px;font-weight:600}
.toggle span{font-size:12px;color:var(--muted);font-family:var(--zh)}
.sw{flex:none;width:46px;height:26px;border-radius:99px;background:#333;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--yellow)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(20px);background:var(--ink)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:grid;gap:10px}
.box p{margin:0;font-size:13px;color:var(--muted);font-family:var(--zh)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #333;background:none;border-radius:99px;padding:7px 13px;font-size:13px;color:var(--muted);font-weight:600}
.chip.on{border-color:var(--yellow);color:var(--ink);background:var(--yellow)}
.chip.lock-c{cursor:default}
.chip i{font-style:normal;font-size:11px;margin-left:5px;opacity:.7}

.day{list-style:none;margin:0 0 0 7px;padding:0;border-left:1px solid #333}
.meal{position:relative;padding:0 0 22px 22px;break-inside:avoid}
.meal:last-child{padding-bottom:0}
.meal::before{content:"";position:absolute;left:-7px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--yellow)}
.meal.fixed::before{background:var(--yellow)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meal-h .t{font-family:var(--head);font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.meal-h h4{margin:2px 0 0;font-family:var(--head);font-size:19px;font-weight:800;letter-spacing:-.02em}
.meal-h h4 small{font-family:var(--zh);font-weight:600;font-size:15px;margin-left:8px;color:#ddd;letter-spacing:0}
.meal-h .kc{font-family:var(--head);font-weight:800;font-size:26px;letter-spacing:-.03em;color:var(--yellow);white-space:nowrap}
.meal-h .kc small{font-size:11px;color:var(--muted);margin-left:3px;font-weight:600;letter-spacing:0}
.meal .what{margin:4px 0 0;font-size:14px}
.meal .sub{margin:2px 0 0;font-size:12px;color:var(--muted);font-family:var(--zh)}
.meal .chips{margin-top:10px}
.plate{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plate span{font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-family:var(--zh)}
.plate span b{color:var(--yellow);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sum div{background:var(--panel);padding:14px;display:grid;gap:2px}
.sum span{font-family:var(--head);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.sum b{font-family:var(--head);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.menu{display:grid;gap:10px}

.menu div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;break-inside:avoid}
.menu h5{margin:0 0 6px;font-family:var(--head);font-size:12px;letter-spacing:.12em;color:var(--yellow);font-weight:800}
.menu h5 span{font-family:var(--zh);letter-spacing:0;margin-left:6px;color:var(--muted);font-weight:500}
.menu p{margin:0;font-size:14px}
.guide{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:4px;font-family:var(--zh)}
.guide b{color:var(--fg)}
.actions{display:grid;gap:10px;margin-top:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:.02em;text-align:center}
.sbtn:hover{border-color:#555}
.sbtn small{display:block;font-family:var(--zh);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.sbtn.y{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.sbtn.y small{color:#4a3c00}
.sbtn.danger{color:var(--danger)}
.sbtn.danger.arm{background:var(--danger);color:var(--ink);border-color:var(--danger)}
.sbtn.danger.arm small{color:var(--ink)}
textarea{width:100%;min-height:84px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--fg);font:inherit;font-family:var(--zh);padding:12px 14px;resize:vertical}
.notes-print{white-space:pre-wrap;font-family:var(--zh);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:var(--ink);padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;font-family:var(--zh);max-width:calc(100% - 32px);text-align:center}

/* ---------- coach ---------- */
.login{display:grid;gap:14px;padding-top:10px}
.login h2,.dash-h h2{margin:0;font-family:var(--head);font-weight:800;font-size:clamp(34px,7vw,48px);letter-spacing:-.04em;line-height:1.02}
.login h2 small,.dash-h h2 small{display:block;font-family:var(--zh);font-size:17px;color:var(--yellow);margin-top:8px;letter-spacing:0;font-weight:700}
.list{display:grid;gap:8px}
.stu{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stu:hover{border-color:#555}
.stu > div{min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--grad-y);color:var(--ink);display:grid;place-items:center;font-weight:900;font-family:var(--head)}
.stu b{display:block;font-family:var(--zh);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu span{font-size:12px;color:var(--muted);font-family:var(--zh)}
.tag{display:inline-block;font-family:var(--head);font-size:10px;font-weight:700;letter-spacing:.08em;border:1px solid #444;border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--fg)}
.stu .kc{font-family:var(--head);font-weight:800;color:var(--yellow);font-size:20px;letter-spacing:-.02em;text-align:right;line-height:1.1}
.stu .kc small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0}

async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt + ":" + pin);
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let h = 5381; for(const b of data) h = ((h<<5) + h + b) >>> 0; return "x" + h.toString(16);
}

const SLOTS = ["breakfast","am","lunch","pm","whey","dinner","eve"];
const SLOT_INFO = {
  breakfast:{t:"07:30", n:["Breakfast · shake","早餐 · 营养奶昔","早餐 · 營養奶昔","Sarapan · shake"], kind:"shake"},

  lunch:    {t:"12:30", n:["Lunch","午餐","午餐","Makan tengah hari"], kind:"plate", list:LUNCH},
  pm:       {t:"16:00", n:["Afternoon shake","下午茶 · 营养奶昔","下午茶 · 營養奶昔","Shake petang"], kind:"shake"},
  whey:     {t:["POST-WORKOUT","运动后","運動後","SELEPAS SENAMAN"], n:["RS Pro Whey","RS Pro Whey 蛋白","RS Pro Whey 蛋白","RS Pro Whey"], kind:"whey"},
  dinner:   {t:"19:00", n:["Dinner","晚餐","晚餐","Makan malam"], kind:"plate", list:DINNER},
  eve:      {t:"21:00", n:["Evening snack","晚餐后加餐","晚餐後加餐","Snek malam"], kind:"snack"}
};
const shakeK = sh => SHAKE_ITEMS.reduce((s,i)=> s + (sh[i.id] ? i.k : 0), 0);

function calc(rec){
  const a = rec.a, mo = rec.mo || {};
  const bmrV = Math.round(bmr(a));
  const maint = Math.round(bmrV * BASE_FACTOR) + (a.activity || 0);
  const adj = adjust(a.goal, a.age);
  let formula = maint + adj, floored = false;
  if(formula < FLOOR[a.gender]){ formula = FLOOR[a.gender]; floored = true; }
  formula = Math.round(formula/10)*10;
  const coachSet = rec.kcalOverride > 0;
  const target = coachSet ? rec.kcalOverride : formula;
  const big = target > SNACK_LINE;
  const baseShake = Object.assign({}, rec.shake); if(big) baseShake.milk = true;   // 高热量：奶昔先固定加牛奶

  const manual = o => {
    if(o.off) return [{kcal:0, off:true, set:true}];
    if(o.custom) return [{kcal:+o.custom.kcal || 0, text:o.custom.text, custom:true, set:true}];
    if(o.shake) return [{kcal:shakeK(o.shake), shake:o.shake, set:true}];
    if(o.portion) return [{kcal:o.portion, portion:o.portion, set:true}];
    if(o.snack){ const sn = SNACKS.find(x=>x.id===o.snack); if(sn) return [{kcal:sn.k, snack:sn, set:true}]; }
    if(o.on) return [{kcal:WHEY, set:true}];
    return null;
  };
  const opts = key => {
    const o = mo[key]; const m = o && manual(o); if(m) return m;
    const info = SLOT_INFO[key];
    if(info.kind==="shake") return [{kcal:shakeK(baseShake), shake:baseShake}];
    if(info.kind==="whey")  return [rec.training ? {kcal:WHEY} : {kcal:0, off:true}];
    if(info.kind==="plate") return info.list.map(k=>({kcal:k, portion:k}));
    return big ? [{kcal:0, off:true}, ...SNACKS.map(sn=>({kcal:sn.k, snack:sn}))] : [{kcal:0, off:true}];
  };
  const fixedK = ["breakfast","pm","whey"].reduce((s,k)=> s + opts(k)[0].kcal, 0);
  const remaining = target - fixedK;
  let best = null;
  for(const L of opts("lunch")) for(const D of opts("dinner")) for(const A of opts("am")) for(const E of opts("eve")){
    const sum = L.kcal + D.kcal + A.kcal + E.kcal;
    const score = Math.abs(sum - remaining) + (D.kcal > L.kcal ? 30 : 0)
      + (A.snack && !A.set ? 40 : 0) + (E.snack && !E.set ? 40 : 0);   // 先正餐，不够才加餐；同分时午餐 ≥ 晚餐
    if(!best || score < best.score) best = {L, D, A, E, score};
  }
  const meals = {breakfast:opts("breakfast")[0], am:best.A, lunch:best.L, pm:opts("pm")[0], whey:opts("whey")[0], dinner:best.D, eve:best.E};
  const total = SLOTS.reduce((s,k)=> s + meals[k].kcal, 0);
  const diff = total - target;
  return {bmr:bmrV, maint, adj, formula, floored, coachSet, target, big, baseShake, meals, total, diff,
    tooLow: diff >= 150, tooHigh: diff <= -300, belowFloor: coachSet && target < FLOOR[a.gender]};
}

const MAC = {f1:[9,13,1.5], f3:[9,0.5,0.5], milk:[8.5,12,4], banana:[0.7,15,0.2]};   // 每份 [蛋白质, 碳水, 脂肪] g
const PLATE_MAC = {800:[67,55,33], 600:[37,55,25], 400:[35,32,14], 300:[33,10,14]};
const SNACK_MAC = {banana:[1.5,35,0.5], apple:[0.5,25,0.3], sandwich:[12,30,9]};
const WHEY_MAC = [30,6,2];
function mealMacros(key, m){
  if(m.off) return [0,0,0];
  if(m.custom){ const k = m.kcal; return [k*.25/4, k*.45/4, k*.30/9]; }
  if(m.shake) return SHAKE_ITEMS.reduce((a,i)=> m.shake[i.id] ? a.map((v,j)=>v+MAC[i.id][j]) : a, [0,0,0]);
  if(m.portion) return PLATE_MAC[m.portion];
  if(m.snack) return SNACK_MAC[m.snack.id] || [0,0,0];
  if(SLOT_INFO[key].kind==="whey") return WHEY_MAC;
  return [0,0,0];
}
const proPerKg = g => (g==="lose"||g==="keepLose") ? 2.0 : (g==="gain"||g==="keepGain") ? 1.8 : 1.6;
function macroTargets(rec, kcal){
  const p = Math.round(rec.a.weight * proPerKg(rec.a.goal));
  const f = Math.round(kcal * 0.25 / 9);
  return [p, Math.max(0, Math.round((kcal - p*4 - f*9) / 4)), f];   // [蛋白质, 碳水, 脂肪]
}

const designedDays = rec => rec.workout.days.filter(d => SECS.some(sec => d[sec].some(it=>it.name)));
function workoutFor(rec, date){
  const days = designedDays(rec), n = Math.min(days.length, 7);
  if(!n) return null;

  return i < 0 ? {rest:true, n} : {day:days[i], idx:i, n};
}

/* ================= PWA：安装到主屏幕 ================= */
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = () => /android/i.test(navigator.userAgent);
const inAppBrowser = () => /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|MicroMessenger|TikTok|Messenger/i.test(navigator.userAgent);
const iosNotSafari = () => isIOS() && /CriOS|FxiOS|EdgiOS|OPiOS/i.test(navigator.userAgent);
const DL = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SHARE_I = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9H6.5a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 17.5 9H16M12 14V3.5m0 0L8.5 7M12 3.5 15.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ADDSQ_I = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8.5v7M8.5 12h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const DOTS_I = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="18.5" r="1.8" fill="currentColor"/></svg>`;
const gaBtn = () => isStandalone() ? "" : `<button class="gabtn" data-getapp aria-label="${t("ga.btn")}">${DL}<span>${t("ga.btn")}</span></button>`;
function getAppSheet(){
  const os = S.gaOS || (isIOS() ? "ios" : "android");
  const browser = os === "ios" ? "Safari" : "Chrome";
  const appIco = `<span class="ico app"><img src="icons/icon-192.png" alt="" /></span>`;
  const steps = os === "ios"
    ? [["ga.i1", `<span class="ico">${SHARE_I}</span>`], ["ga.i2", `<span class="ico">${ADDSQ_I}</span>`], ["ga.i3", appIco]]
    : [["ga.a1", `<span class="ico" style="color:#ddd">${DOTS_I}</span>`], ["ga.a2", `<span class="ico" style="color:#ddd">${ADDSQ_I}</span>`], ["ga.a3", appIco]];
  const warn = inAppBrowser() ? t("ga.inapp",{b:browser}) : (os === "ios" && iosNotSafari()) ? t("ga.iosother") : "";
  return `<div class="sheet-bg" data-sheetclose></div>
  <div class="sheet ${S.sheetFresh ? "anim" : ""}" role="dialog" aria-modal="true" aria-label="${t("ga.h")}">
    <div class="grab"></div>
    <div class="sheet-hd"><button class="circ" data-sheetclose aria-label="${t("close")}">×</button><div><b>${t("ga.btn")}</b><small>BurnUp Coaching</small></div><span></span></div>
    <div class="gahead"><img src="icons/icon-192.png" alt="" /><div><b>${t("ga.h")}</b><small>${t("ga.sub")}</small></div></div>
    ${installEvt && !inAppBrowser() ? `<button class="btn btn-y block" data-install>${DL} ${t("ga.install")}</button>` : ""}
    ${warn ? `<div class="ganote">${warn}<button class="btn btn-o sm" data-copylink="${browser}">${t("ga.copy")}</button></div>` : ""}
    <div class="gaos" role="tablist"><button class="${os==="android"?"on":""}" data-gaos="android" role="tab" aria-selected="${os==="android"}">${t("ga.android")}</button><button class="${os==="ios"?"on":""}" data-gaos="ios" role="tab" aria-selected="${os==="ios"}">${t("ga.iphone")}</button></div>
    <ol class="gasteps">${steps.map(([k, ico]) => `<li><span>${t(k)}</span>${ico}</li>`).join("")}</ol>
    ${!isIOS() && !isAndroid() ? `<p class="hint" style="margin:0;font-size:12px">${t("ga.desk")}</p>` : ""}
  </div>`;
}
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if(["home","today"].includes(S.view)) render(); });
window.addEventListener("appinstalled", () => { installEvt = null; LS.set("bu_pwa_off", true); toast(t("pwa.done")); render(); });
function installCard(){
  if(isStandalone() || LS.get("bu_pwa_off", false)) return "";
  return `<section class="card install noprint">
    <img src="icons/icon-192.png" alt="" />
    <b>${t("pwa.h")}</b><p>${t("pwa.p")}</p>
    <div class="acts"><button class="btn btn-y sm" data-getapp>${DL} ${t("ga.btn")}</button><button class="btn btn-o sm" data-installoff>${t("pwa.later")}</button></div>
  </section>`;
}

/* ================= 渲染 ================= */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toLocaleDateString("en-GB");
const fmtDate = tm => tm ? new Date(tm).toLocaleDateString("en-GB") : "";

function langSel(){
  return `<select class="langsel" id="langsel" aria-label="${t("lang")}">${LANGS.map(l=>`<option value="${l.id}" ${l.id===LANG?"selected":""}>${l.short}</option>`).join("")}</select>`;
}
function nav(){
  let right;
  if(isCoach()) right = `<span class="badge">COACH</span>${S.view!=="home" ? `<button class="nlink" data-go="home">${t("nav.students")}</button>` : `<button class="nlink" data-logout>${t("nav.logout")}</button>`}`;
  else if(cloudOn()) right = `<span class="acct">${esc(S.user.email)}</span>${S.view!=="plan" && planReady(S.rec) ? `<button class="nlink" data-myplan>${t("nav.myplan")}</button>` : ""}<button class="nlink" data-logout>${t("nav.logout")}</button>`;
  else if(CLOUD && S.view==="home") right = `<button class="nlink" data-coach>${t("nav.coach")}</button><button class="nbtn" data-auth="signin">${t("nav.login")} ${ARROW}</button>`;
  else if(S.view==="home") right = `<button class="nlink" data-coach>${t("nav.coach")}</button><button class="nbtn" data-start>${t("nav.start")} ${ARROW}</button>`;
  else right = `<button class="nlink" data-go="home">${t("nav.home")}</button>`;
  return `<header class="nav noprint"><div class="nav-in">
    <button class="logo" data-go="home" aria-label="BurnUp">${LOGO("h")}</button>
    <div class="nav-r">${gaBtn()}${langSel()}${right}</div></div></header>`;
}
const inShell = () => !isCoach() && planReady(S.rec) && ["today","plan","workout"].includes(S.view);
function appHeader(){
  const h = new Date().getHours(), nm = S.rec.name || "";
  return `<header class="apphd noprint"><div class="wrap narrow apphd-in">
    <div class="me"><button class="avatar" data-menu aria-label="Menu" aria-expanded="${!!S.menu}">${esc((nm || "B").trim().charAt(0).toUpperCase())}</button>
      <div><small>${t(h<12 ? "hi.m" : h<18 ? "hi.a" : "hi.e")}</small><b>${esc(nm || "BurnUp")}</b></div></div>
    <div class="nav-r">${gaBtn()}${langSel()}</div>
    ${S.menu ? `<div class="pmenu"><button data-edit>${t("menu.edit")}</button><button data-gohome>${t("menu.home")}</button>${cloudOn() ? `<button data-logout>${t("nav.logout")}</button>` : ""}</div>` : ""}
  </div></header>`;
}
const bnav = active => `<nav class="bnav noprint" aria-label="App"><div class="bnav-in">
  <button class="${active==="today"?"on":""}" data-go="today" aria-label="${t("nav.today")}">${IC.home}<span>${t("nav.today")}</span></button>
  <button class="${active==="plan"?"on":""}" data-go="plan" aria-label="${t("tab.meal")}">${IC.meal}<span>${t("tab.meal")}</span></button>
  <button class="${active==="workout"?"on":""}" data-workout aria-label="${t("tab.workout")}">${IC.dumb}<span>${t("tab.workout")}</span></button>
</div></nav>`;

/* ---------- 今天（学员首页） ---------- */
function workoutCard(rec, date, compact){
  const w = workoutFor(rec, date), L = dayLog(ymd(date));
  if(!w) return `<section class="wkc"><div class="bolt-bg">${BOLT("w0")}</div><div class="k">${t("today.wk")}</div><h3>${t("wk.nodesign")}</h3><p>${t("fit.toast")}</p></section>`;
  if(w.rest){
    let nx = date; for(let i=1;i<=7;i++){ nx = new Date(date); nx.setDate(date.getDate()+i); const ww = workoutFor(rec, nx); if(ww && !ww.rest) break; }
    return `<section class="wkc"><div class="bolt-bg">${BOLT("w1")}</div><div class="k">${t("today.wk")}</div><h3>${t("wk.restday")}</h3><p>${t("wk.restTip")}</p>

function authErr(ex){
  const c = (ex && ex.code) || "";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return t("err.auth.cred");
  if(/email-already-in-use/.test(c)) return t("err.auth.inuse");
  if(/weak-password/.test(c)) return t("err.auth.weak");
  if(/invalid-email|missing-email/.test(c)) return t("err.auth.email");
  if(/too-many-requests/.test(c)) return t("err.auth.many");
  if(/network-request-failed/.test(c)) return t("err.auth.net");
  return t("err.auth.other",{c: c || String(ex && ex.message || ex)});
}

  const list = q ? all.filter(s => (s.name||"").toLowerCase().includes(q)) : all;
  const row = s => {
    const r = normalize(s);
    let kc = "—"; try{ if(planReady(r)) kc = calc(r).target; }catch(e){}
    const g = GOALS[r.a.goal], wd = r.workout.days.length;
    return `<button class="stu" data-open="${esc(r.id)}">
      <div class="av">${esc((r.name||"?").trim().charAt(0).toUpperCase())}</div>
      <div><b>${esc(r.name||t("unnamed"))}</b><span>${g ? tx(g.n) : t("incomplete")} · ${r.a.weight ?? "–"} kg · ${fmtDate(r.updated)}${r.email ? `<span class="tag">APP</span>` : ""}${wd ? `<span class="tag">${wd}D WORKOUT</span>` : ""}</span></div>
      <div class="kc num">${kc}<small>${t("kcalday")}</small></div></button>`;
  };
  return `
  <div class="dash-h"><h2>${t("dash.h")}<small>${t("dash.count",{n:all.length})}</small></h2></div>
  <button class="btn btn-y block" data-new>${t("dash.new")}</button>
  ${all.length > 5 ? `<input class="search" id="search" type="search" placeholder="${t("dash.search")}" value="${esc(S.q)}" />` : ""}
  <div class="list">${list.length ? list.map(row).join("") : `<div class="empty">${all.length ? t("dash.nomatch") : t("dash.empty")}</div>`}</div>
  <div class="row">
    <button class="sbtn" data-export>${t("dash.backup")}<small>.json</small></button>
    <button class="sbtn" data-import>${t("dash.restore")}<small>.json</small></button>
  </div>
  <p class="foot" style="margin-top:8px">${t(cloudOn() ? "dash.cloud" : "dash.note")}</p>`;
}

/* ---------- 问答 ---------- */
function quiz(){
  const steps = quizSteps(), st = steps[S.step];
  const val = st.key==="name" ? S.rec.name : S.rec.a[st.key];
  let body;
  if(st.type === "choice"){
    body = `<div class="opts">${st.opts.map(o=>`
      <button class="opt ${val===o.v?"on":""}" data-pick="${o.v}"><span>${esc(o.n)}</span>${o.s?`<span class="s">${esc(o.s)}</span>`:""}</button>`).join("")}</div>`;
  } else {
    const txt = st.type==="text";
    body = `<form id="numf" novalidate>
      <label class="field" for="in-${st.key}">
        <input id="in-${st.key}" class="autofocus ${txt?"txt":""}" type="${txt?"text":"number"}" ${txt?'autocomplete="off" maxlength="40"':`inputmode="${st.dec?"decimal":"numeric"}" step="${st.dec?"0.1":"1"}"`} placeholder="${txt?t("q.name.ph"):"0"}" value="${esc(val ?? "")}" aria-label="${esc(t(st.q))}" />
        ${st.unit?`<span class="u">${st.unit}</span>`:""}
      </label>
      <p class="err" id="err"></p>
      <button class="btn btn-y block" type="submit">${t("next")} ${ARROW}</button>
    </form>`;
  }
  return `
  <div class="bar"><i style="width:${(S.step/steps.length)*100}%"></i></div>
  ${S.step>0 ? `<button class="back" data-back>${t("back")}</button>` : `<button class="back" data-go="home">${t("back.home")}</button>`}
  <div>
    <div class="step-k num">${t("q.label",{n:S.step+1, m:steps.length})}</div>
    <div class="q"><b>${t(st.q)}</b></div>
    ${st.hint ? `<p class="hint">${t(st.hint)}</p>` : ""}
  </div>
  ${body}`;
}

/* ---------- 餐单 ---------- */
const shakeName = sh => SHAKE_ITEMS.filter(i=>sh[i.id]).map(i=>tx(i.n)).join(" + ");
const plateParts = k => { const p = PORTION[k]; return [[t("lab.carbs"), p.rice ? t(p.rice) : t("rnone")], [t("lab.protein"), t(p.pro)], [t("lab.veg"), t("p1")]]; };
const plateHTML = k => `<div class="plate">${plateParts(k).map(([l,v])=>`<span>${l} <b>${v}</b></span>`).join("")}</div>`;
function mealDesc(key, m){
  const kind = SLOT_INFO[key].kind;
  if(m.off) return `<p class="sub">${t(kind==="snack" ? "off.snack" : "off.meal")}</p>`;
  if(m.custom) return `<p class="what">${esc(m.text || "—")}</p><p class="sub">${t("custom.sub")}</p>`;
  if(m.shake) return `<p class="what">${esc(shakeName(m.shake))}</p><p class="sub">${t(m.shake.milk ? "shake.milk" : "shake.water")}</p>`;
  if(m.portion) return plateHTML(m.portion);
  if(m.snack) return `<p class="what">${tx(m.snack.n)}</p>`;
  if(kind==="whey") return `<p class="sub">${t("whey.sub")}</p>`;
  return "";
}
function mealEditor(key, m, r){
  const info = SLOT_INFO[key], mo = S.rec.mo[key] || {};
  let presets = "";
  if(info.kind==="plate") presets = info.list.map(k=>`<button class="chip ${mo.portion===k?"on":""}" data-mset="${key}:portion:${k}">${k} kcal<i>${PORTION[k].rice ? t(PORTION[k].rice) : t("rnone")}</i></button>`).join("");
  if(info.kind==="snack") presets = SNACKS.map(sn=>`<button class="chip ${mo.snack===sn.id?"on":""}" data-mset="${key}:snack:${sn.id}">${tx(sn.n)}<i>${sn.k}</i></button>`).join("");
  if(info.kind==="shake"){ const cur = m.shake || r.baseShake; presets = SHAKE_ITEMS.map(i=>`<button class="chip ${cur[i.id]?"on":""} ${i.lock?"lock-c":""}" data-mshake="${key}:${i.id}" ${i.lock?'aria-disabled="true"':""}>${tx(i.n)}<i>${i.k}</i></button>`).join(""); }
  if(info.kind==="whey") presets = `<button class="chip ${mo.on?"on":""}" data-mset="whey:on:1">${t("include")}<i>${WHEY}</i></button>`;
  return `<div class="medit noprint">
    <div class="lab">${t("preset")}</div><div class="chips">${presets}</div>
    <div class="lab">${t("custom")}</div>
    <div class="cust"><input id="ct-text-${key}" value="${esc(mo.custom ? mo.custom.text : "")}" placeholder="${t("custom.ph")}" aria-label="${t("custom")}" />
      <input id="ct-kcal-${key}" type="number" inputmode="numeric" value="${mo.custom ? esc(mo.custom.kcal) : ""}" placeholder="kcal" aria-label="kcal" />
      <button class="mini" data-mcustom="${key}">${t("apply")}</button></div>
    <div class="chips"><button class="chip" data-mauto="${key}">${t("auto")}</button><button class="chip" data-moff="${key}">${t("remove")}</button><button class="chip" data-mclose>${t("done")}</button></div>
  </div>`;
}
function mealBlock(key, m, r){
  const info = SLOT_INFO[key], coach = isCoach();
  if(!(coach || !m.off || (info.kind==="snack" && r.big))) return "";
  const set = !!S.rec.mo[key];
  const editBtn = coach ? `<button class="ebtn noprint ${S.editMeal===key?"on":""}" data-medit="${key}">${t(S.editMeal===key?"close":"edit")}</button>` : "";
  const studentSnack = (!coach && info.kind==="snack" && r.big) ? `<div class="chips noprint" style="margin-top:10px">${SNACKS.map(sn=>`<button class="chip ${m.snack&&m.snack.id===sn.id?"on":""}" data-snack="${key}:${sn.id}">${tx(sn.n)}<i>${sn.k}</i></button>`).join("")}<button class="chip ${m.off?"on":""}" data-snack="${key}:none">${t("off.snack")}</button></div>` : "";
  return `<li class="meal ${m.off?"off noprint":""} ${info.kind==="plate"?"":"fixed"}">
    <div class="meal-h"><div><div class="t">${tx(info.t)}</div><h4>${tx(info.n)}${coach && set ? `<span class="ctag noprint">${t("tag.adjusted")}</span>` : ""}</h4></div>
      <div class="mr"><div class="kc num">${m.kcal}<small>kcal</small></div>${editBtn}</div></div>
    ${mealDesc(key, m)}${m.shake && !m.off ? `<button class="mixbtn noprint ${S.mix===key?"on":""}" data-mix="${key}">${PLAY} ${t("mix.btn")}</button>` + (S.mix===key ? mixHTML(key, m.shake, m.kcal) : "") : ""}${studentSnack}${coach && S.editMeal===key ? mealEditor(key, m, r) : ""}</li>`;
}
function plan(){
  const rec = S.rec, a = rec.a, r = calc(rec), coach = isCoach();
  const g = GOALS[a.goal], act = ACT.find(x=>x.v===a.activity) || ACT[0];
  const adjTxt = (r.adj>0?"+":"") + r.adj;
  const diffTxt = (r.diff>0?"+":"") + r.diff;
  const anySet = Object.keys(rec.mo||{}).length > 0;
  const math = !coach ? t("math.client",{goal:tx(g.n)}) : r.coachSet ? t("math.coach",{f:r.formula})
    : t("math.auto",{m:r.maint, b:r.bmr, act: a.activity ? t("math.cardio",{x:a.activity}) : t("math.light"), adj:adjTxt, goal:tx(g.n) + ((a.goal==="gain"||a.goal==="lose")&&a.age>=40 ? " · 40+" : "")});
  const tedit = !coach ? "" : (S.editTarget
    ? `<div class="tedit noprint"><input id="kcal-ovr" type="number" inputmode="numeric" value="${r.target}" aria-label="kcal" /><button class="mini" data-tsave>${t("save")}</button>${r.coachSet ? `<button class="mini o" data-tauto>${t("useFormula")}</button>` : ""}<button class="mini o" data-tcancel>${t("cancel")}</button></div>`
    : `<div class="tedit noprint"><button class="ebtn" data-tedit>${t("target.adjust")}</button>${r.coachSet ? `<span class="ctag">${t("tag.coachset")}</span>` : ""}</div>`);
  return `
  ${tabs("plan")}
  <button class="back noprint" data-edit>${t("plan.edit")}</button>
  ${rec.name ? `<p class="client">${esc(rec.name)}</p>` : ""}
  <div class="who">${t(a.gender==="m"?"g.m":"g.f")} · ${a.age} ${t("u.yrs")} · ${a.height} cm · ${a.weight} kg · ${tx(act.n)} · <b>${tx(g.n)}</b></div>
  <section class="target">
    <div class="k">${t("target.k")}</div>
    <div class="big num">${r.target}<small>kcal</small></div>
    <div class="math num">${math}</div>
    ${tedit}
  </section>
  ${r.floored && !r.coachSet ? `<div class="note">${t("note.floor",{n:FLOOR[a.gender]})}</div>` : ""}
  ${r.belowFloor ? `<div class="note noprint">${t("note.belowFloor",{n:FLOOR[a.gender]})}</div>` : ""}

  <div class="sec-h noprint"><h3>${t("setup")}</h3></div>
  <button class="toggle noprint" data-train aria-pressed="${rec.training}">
    <div><b>${t("train.t")}</b><span>${t("train.s",{k:WHEY})}</span></div><div class="sw"></div>
  </button>
  <div class="box noprint">
    <p>${t("shake.p")}${r.big ? "<br>" + t("shake.big") : ""}</p>
    <div class="chips">${SHAKE_ITEMS.map(i=>{ const locked = i.lock || (r.big && i.id==="milk"); return `<button class="chip ${r.baseShake[i.id]?"on":""} ${locked?"lock-c":""}" data-shake="${i.id}" ${locked?'aria-disabled="true"':""}>${tx(i.n)}<i>${i.k}</i></button>`; }).join("")}</div>
  </div>

  <div class="sec-h"><h3>${t("mealplan.h")}</h3></div>
  ${coach ? `<p class="hint noprint">${t("coach.mealhint")}${anySet ? ` <button class="ebtn" data-mreset>${t("resetAll")}</button>` : ""}</p>` : ""}
  <ul class="day">${SLOTS.map(k=>mealBlock(k, r.meals[k], r)).join("")}</ul>
  <div class="sum num">
    <div><span>${t("sum.target")}</span><b>${r.target}</b></div>
    <div><span>${t("sum.plan")}</span><b>${r.total}</b></div>
    <div><span>${t("sum.gap")}</span><b style="color:${Math.abs(r.diff)<=100?"var(--good)":"var(--warn)"}">${diffTxt}</b></div>
  </div>
  ${r.tooLow ? `<div class="note">${t("note.over",{n:r.diff})} ${t(coach?"note.over.c":"note.over.s")}</div>` : ""}
  ${r.tooHigh ? `<div class="note">${t("note.under",{n:-r.diff})} ${t(coach?"note.under.c":"note.under.s")}</div>` : ""}

  <div class="sec-h"><h3>${t("options.h")}</h3></div>
  ${carbGallery()}
  ${proGallery()}
  ${vegCard()}
  <ul class="guide"><li>${t("guide1")}</li><li>${t("guide2")}</li><li>${t("guide3")}</li><li>${t("guide4")}</li></ul>

  ${coach ? `<div class="sec-h"><h3>${t("notes.h")}</h3><span>${t("notes.sub")}</span></div>
  <textarea id="note" class="noprint" placeholder="${t("notes.ph")}">${esc(rec.note)}</textarea>
  ${rec.note ? `<div class="box print-only notes-print">${esc(rec.note)}</div>` : ""}` : ""}

  <div class="actions noprint">
    <button class="btn btn-y block" data-pdf>${t("pdf")} ${ARROW}</button>
    <div class="row">
      <button class="sbtn" data-dl>${t("dl")}<small>${t("dl.s")}</small></button>
      <button class="sbtn" data-copy="meal">${t("copy")}<small>${t("copy.s")}</small></button>
    </div>
    ${coach ? `<button class="sbtn danger ${S.arm?"arm":""}" data-del>${t(S.arm?"del.arm":"del")}</button>` : ""}
  </div>`;
}

/* ---------- 训练设计（教练专用）：热身 / 主训练 / 拉伸放松 ---------- */
function workout(){
  const w = S.rec.workout, days = w.days;
  const secHTML = (d, i, sec) => `
    <div class="wsec">
      <div class="wsec-h ${sec}"><i></i>${t("sec."+sec)}<span>${t("wk.exercises",{n:d[sec].length})}</span></div>
      <div class="ex-head"><span class="nm">${t("col.ex")}</span><span>${t("col.sets")}</span><span>${t("col.reps")}</span><span>${t("col.weight")}</span><span>${t("col.rest")}</span><span></span></div>
      <div class="exl">${d[sec].map((it, j) => `
        <div class="exr">
          <input class="nm" list="exlib" value="${esc(it.name)}" data-wd="${i}" data-ws="${sec}" data-wx="${j}" data-wf="name" placeholder="${t("ex.ph")}" aria-label="${t("col.ex")}" />
          <input value="${esc(it.sets)}" data-wd="${i}" data-ws="${sec}" data-wx="${j}" data-wf="sets" placeholder="3" inputmode="numeric" aria-label="${t("col.sets")}" />
          <input value="${esc(it.reps)}" data-wd="${i}" data-ws="${sec}" data-wx="${j}" data-wf="reps" placeholder="10" aria-label="${t("col.reps")}" />
          <input value="${esc(it.weight)}" data-wd="${i}" data-ws="${sec}" data-wx="${j}" data-wf="weight" placeholder="kg" aria-label="${t("col.weight")}" />
          <input value="${esc(it.rest)}" data-wd="${i}" data-ws="${sec}" data-wx="${j}" data-wf="rest" placeholder="60s" aria-label="${t("col.rest")}" />
          <button class="x" data-delex="${i}:${sec}:${j}" aria-label="×">×</button>
        </div>`).join("")}</div>
      <button class="addex" data-addex="${i}:${sec}">${t("wk.addex")}</button>
    </div>`;
  const dayHTML = (d, i) => `
    <div class="wday noprint">
      <div class="wday-h">
        <input class="dn" value="${esc(d.name)}" data-wd="${i}" data-wf="dname" aria-label="Day" placeholder="${t("wk.dayname",{n:i+1})}" />
        <button class="x" data-delday="${i}" aria-label="${t("wk.delday")}" title="${t("wk.delday")}">×</button>
      </div>
      ${SECS.map(sec=>secHTML(d, i, sec)).join("")}
    </div>`;
  const roHTML = workoutTables(days);
  const ro = roHTML ? `<div class="wro print-only blockp">${roHTML}</div>` : "";
  return `
  ${tabs("workout")}
  ${S.rec.name ? `<p class="client">${esc(S.rec.name)}</p>` : ""}
  <section class="target">
    <div class="k">${t("wk.k")}</div>
    <div class="big num">${days.length}<small>${t("wk.days")}</small></div>
    <div class="math">${t("wk.by")}</div>
  </section>

  <div class="box tpl noprint">
    <p>${t("wk.quick")}${days.length ? t("wk.overwrite") : ""}</p>
    <div class="chips"><span class="lab">${t("wk.goal")}</span>
      <button class="chip ${S.tplGoal==="build"?"on":""}" data-tplgoal="build">${t("wk.build")}</button>
      <button class="chip ${S.tplGoal==="burn"?"on":""}" data-tplgoal="burn">${t("wk.burn")}</button>
    </div>
    <div class="chips"><span class="lab">${t("wk.apply")}</span>
      ${[3,4,5].map(n=>`<button class="chip" data-tpl="${n}">${t("wk.nday",{n})}</button>`).join("")}
      <button class="chip" data-tpl="0">${t("wk.blank")}</button>
    </div>
    ${S.arm && S.armTpl!=null ? `<p style="color:var(--warn)">${t("wk.confirm")}</p>` : ""}
  </div>

  ${days.length ? days.map(dayHTML).join("") : `<div class="empty noprint">${t("wk.empty")}</div>`}
  <button class="btn btn-o block noprint" data-addday>${t("wk.addday")}</button>
  ${ro}

  <div class="sec-h"><h3>${t("wk.notes")}</h3></div>
  <textarea id="wnote" class="noprint" placeholder="${t("wk.notes.ph")}">${esc(w.note)}</textarea>
  ${w.note ? `<div class="box print-only notes-print">${esc(w.note)}</div>` : ""}

  <datalist id="exlib">${Object.values(EX).map(e=>`<option value="${esc(tx(e))}"></option>`).join("")}</datalist>
  <div class="actions noprint">
    <button class="btn btn-y block" data-pdf>${t("pdf")} ${ARROW}</button>
    <div class="row">
      <button class="sbtn" data-dl>${t("dl")}<small>${t("dl.s")}</small></button>
      <button class="sbtn" data-copy="fit">${t("copy")}<small>${t("copy.s")}</small></button>
    </div>
  </div>`;
}

const SPOON_SVG = `<img src="${IMG.spoon}" alt="">`;
const BANANA_SVG = `<svg viewBox="0 0 52 34" aria-hidden="true"><path d="M3 22 Q20 36 46 10 Q49 6 46 4 Q42 4 41 7 Q26 26 6 17 Q1 16 3 22Z" fill="#FFD93D" stroke="#9a7400" stroke-width="1.2"/><path d="M46 4 l3 -3" stroke="#5a4500" stroke-width="2.5" stroke-linecap="round"/></svg>`;
const MIX = {f1:"#9a6f4f", f3:"#eadfc9", milk:"#f4f0e8", water:"rgba(160,205,255,.45)", mixMilk:"#c89f7c", mixWater:"#9b6f4e"};
let mixRun = 0;
function mixSteps(sh){
  const st = [t("mix.s.f1")];
  if(sh.f3) st.push(t("mix.s.f3"));
  st.push(t(sh.milk ? "mix.milk" : "mix.water"), t("mix.shake"));
  if(sh.banana) st.push(t("mix.banana"));
  return st;
}
function mixHTML(key, sh, kcal){
  S.mixData = {sh, kcal};
  return `<div class="mix noprint" id="mix">
    <div class="mix-cap"><span id="mixcap" aria-live="polite">${t("mix.f1",{i:1})}</span><button class="mini o" data-mixreplay>${t("mix.replay")}</button></div>
    <div class="mix-wrap" id="mixwrap"><div class="stage" id="stage" aria-hidden="true">
      <div class="floor"></div>
      <img class="can f1" src="${IMG.f1}" alt="Formula 1" />
      ${sh.f3 ? `<img class="can f3" src="${IMG.f3}" alt="Formula 3" />` : ""}
      ${sh.banana ? `<div class="banana" id="banana">${BANANA_SVG}</div>` : ""}
      <div class="cupgrp" id="cupgrp"><div class="cup"><div class="pow p1" id="pow1"></div><div class="pow p3" id="pow3"></div><div class="liq" id="liq"><div class="foam" id="foam"></div></div><div class="ticks"></div></div><div class="cuplid" id="cuplid">${BOLT("m")}</div></div>
      <div class="carton ${sh.milk?"milk":"water"}" id="carton"><span>${sh.milk?"MILK":"H₂O"}</span></div>
      <div class="stream" id="stream" style="background:${sh.milk?MIX.milk:"rgba(170,215,255,.8)"}"></div>
      <div class="lev" id="lev"></div>
      <div class="spoon" id="spoon">${SPOON_SVG}<div class="heap" id="heap"></div></div>
    </div></div>
    <ol class="mix-steps">${mixSteps(sh).map((x,i)=>`<li data-st="${i}">${x}</li>`).join("")}</ol>
  </div>`;
}
async function startMix(){
  const id = ++mixRun, $ = q => document.getElementById(q);
  const wrap = $("mixwrap"); if(!wrap || !S.mixData) return;
  wrap.style.setProperty("--s", Math.min(1, wrap.clientWidth/360));
  const {sh, kcal} = S.mixData;
  const cap = $("mixcap"), spoon = $("spoon"), heap = $("heap"), lev = $("lev"), stage = $("stage");
  const steps = [...document.querySelectorAll(".mix-steps li")];
  const live = () => { if(id !== mixRun || !document.body.contains(stage)) throw "stop"; };
  const A = (el, kf, dur, o={}) => el.animate(kf, Object.assign({duration:dur, fill:"forwards", easing:"cubic-bezier(.45,0,.25,1)"}, o)).finished;
  const wait = ms => new Promise(r=>setTimeout(r, ms));
  const pose = (x,y,r=0) => `translate(${x-17}px,${y-11}px) rotate(${r}deg)`;
  let cur = [175, 34, 0];
  const move = async (x,y,r,dur) => { const to=[x,y,r]; await A(spoon, [{transform:pose(...cur)},{transform:pose(...to)}], dur); cur=to; live(); };
  const mark = i => steps.forEach((li,j)=>{ li.classList.toggle("on", j===i); li.classList.toggle("done", j<i); });
  const drop = (x, y, toY, color, n) => { for(let k=0;k<n;k++){ const p=document.createElement("div"); p.className="pt"; p.style.background=color; p.style.left=x+"px"; p.style.top=y+"px"; stage.appendChild(p);
      const dx=(Math.random()-.5)*16; p.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${dx}px,${toY-y}px)`,opacity:.9}],{duration:380+Math.random()*220,delay:k*35,easing:"cubic-bezier(.5,0,1,1)",fill:"forwards"}).finished.then(()=>p.remove()); } };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const liq = $("liq"), pow1 = $("pow1"), pow3 = $("pow3"), cupgrp = $("cupgrp"), cuplid = $("cuplid"), foam = $("foam");
  const mixColor = sh.milk ? MIX.mixMilk : MIX.mixWater;
  if(reduced){   // 不播放动画：直接显示完成状态
    liq.style.height="96px"; liq.style.background=mixColor; foam.style.opacity=1; cap.textContent=t("mix.done",{k:kcal});
    steps.forEach(li=>li.classList.add("done")); if(sh.banana) $("banana").style.opacity=1; return;
  }
  try{
    spoon.style.transform = pose(...cur);
    let si = 0, p1h = 0, p3h = 0;
    await wait(300); live();
    const scoop = async (canX, mouthY, color, label, i) => {
      cap.textContent = label;
      heap.style.background = color;
      await move(canX, mouthY-26, 0, 550);
      await move(canX, mouthY-2, 8, 300);                       // 舀
      A(heap, [{transform:"scale(0)"},{transform:"scale(1.15)"}], 260);
      await move(canX, mouthY-30, 0, 380);                      // 拿起（满匙）
      // 刮平
      lev.style.left = (canX-44)+"px"; lev.style.top = (mouthY-37)+"px";
      await A(lev, [{opacity:0,transform:"translateX(0)"},{opacity:1,transform:"translateX(8px)"}], 150); live();
      A(heap, [{transform:"scale(1.15)"},{transform:"scale(1,.5)"}], 420);
      drop(canX+10, mouthY-34, mouthY, color, 4);
      await A(lev, [{opacity:1,transform:"translateX(8px)"},{opacity:1,transform:"translateX(70px)"}], 420); live();
      A(lev, [{opacity:1},{opacity:0}], 150);
      // 倒进 shaker
      await move(268, 50, 0, 650);
      await move(270, 54, 62, 300);
      drop(268, 60, 214 - p1h - p3h, color, 9);
      await A(heap, [{transform:"scale(1,.5)"},{transform:"scale(0)"}], 260); live();
      await wait(250); live();
      await move(268, 50, 0, 250);
    };
    mark(si);
    for(let i=1;i<=3;i++){
      await scoop(50, 88, MIX.f1, t("mix.f1",{i}), i);
      const h0=p1h; p1h+=7; await A(pow1, [{height:h0+"px"},{height:p1h+"px"}], 250); live();
    }
    if(sh.f3){
      mark(++si); pow3.style.bottom = p1h+"px";
      for(let i=1;i<=2;i++){
        await scoop(138, 136, MIX.f3, t("mix.f3",{i}), i);
        const h0=p3h; p3h+=5; await A(pow3, [{height:h0+"px"},{height:p3h+"px"}], 250); live();
      }
    }
    await move(175, 34, 0, 500);
    // 倒液体
    mark(++si); cap.textContent = t(sh.milk ? "mix.milk" : "mix.water");
    const carton = $("carton"), stream = $("stream");
    await A(carton, [{transform:"translate(90px,-30px)"},{transform:"translate(0,0)"}], 500); live();
    await A(carton, [{transform:"translate(0,0)"},{transform:"translate(-6px,4px) rotate(-72deg)"}], 420); live();
    const liqColor = sh.milk ? MIX.milk : MIX.water;
    liq.style.background = liqColor;
    await A(stream, [{height:"0px"},{height:"172px"}], 260); live();
    await A(liq, [{height:"0px"},{height:"96px"}], 1500, {easing:"linear"}); live();
    await A(stream, [{height:"172px",transform:"translateY(0)"},{height:"0px",transform:"translateY(172px)"}], 220); live();
    await A(carton, [{transform:"translate(-6px,4px) rotate(-72deg)"},{transform:"translate(90px,-30px)"}], 500); live();
    // 盖上、摇
    mark(++si); cap.textContent = t("mix.shake");
    await A(cuplid, [{opacity:0,transform:"translateY(-50px)"},{opacity:1,transform:"translateY(0)"}], 380, {easing:"cubic-bezier(.3,1.4,.6,1)"}); live();
    const shakeKF = []; for(let k=0;k<=12;k++){ const a = k%2 ? 16 : -16; shakeKF.push({transform: k===0||k===12 ? "none" : `translate(${a/2}px,-${12+(k%3)*3}px) rotate(${a}deg)`}); }
    A(liq, [{background:liqColor},{background:mixColor}], 1600);
    A(pow1, [{opacity:1},{opacity:0}], 1100); A(pow3, [{opacity:1},{opacity:0}], 1100);
    await A(cupgrp, shakeKF, 1800, {easing:"linear"}); live();
    await A(cuplid, [{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translate(18px,-46px) rotate(18deg)"}], 420); live();
    A(foam, [{opacity:0},{opacity:1}], 400);
    if(sh.banana){ mark(++si); cap.textContent = t("mix.banana");
      await A($("banana"), [{opacity:0,transform:"translateY(-40px) rotate(-20deg)"},{opacity:1,transform:"none"}], 600, {easing:"cubic-bezier(.3,1.4,.6,1)"}); live(); await wait(900); live(); }
    mark(steps.length); cap.innerHTML = `<b style="color:var(--yellow)">${t("mix.done",{k:kcal})}</b>`;
  }catch(e){ if(e !== "stop") console.warn(e); }
}

function mealText(){
  const rec=S.rec, r=calc(rec), g=GOALS[rec.a.goal];
  const icons = {breakfast:"🥤", am:"🍎", lunch:"🍱", pm:"🥤", whey:"💪", dinner:"🍽", eve:"🍌"};
  const line = (key, m) => {
    if(m.custom) return m.text || "—";
    if(m.shake) return `${shakeName(m.shake)} (${t(m.shake.milk ? "shake.milk" : "shake.water")})`;
    if(m.portion) return plateParts(m.portion).map(([l,v])=>`${l} ${v}`).join(" / ");
    if(m.snack) return tx(m.snack.n);
    if(key==="whey") return t("whey.sub");
    return "";
  };
  let s = `⚡ *BurnUp Coaching* · with Herbalife\n${rec.name ? rec.name + " · " : ""}${tx(g.n)}\n${t("txt.target")}: *${r.target} kcal*\n\n`;
  SLOTS.forEach(k => { const m=r.meals[k], i=SLOT_INFO[k]; if(m.off) return;
    s += `${icons[k]} *${tx(i.n)} · ${tx(i.t)}* — ${m.kcal} kcal\n${line(k,m)}\n\n`; });
  s += `${t("carbs.h")}: ${t("carbs.l")}\n${t("protein.h")}: ${t("protein.l")}\n${t("veg.h")}: ${t("veg.l")}\n📏 ${t("guide1").replace(/<\/?b>/g,"")}\n📏 ${t("guide2").replace(/<\/?b>/g,"")}\n\n${t("txt.total",{n:r.total})}`;
  if(rec.note && isCoach()) s += `\n\n📝 ${rec.note}`;
  return s;
}
function fitText(){
  const w = S.rec.workout;
  const icon = {warm:"🔥", main:"💪", cool:"🧘"};
  let s = `⚡ *BurnUp Coaching · ${t("wk.title")}*\n${S.rec.name ? S.rec.name + " · " : ""}${w.days.length} ${t("wk.days")}\n\n`;
  w.days.forEach(d => {
    s += `*${d.name}*\n`;
    SECS.forEach(sec => {
      const rows = d[sec].filter(it=>it.name); if(!rows.length) return;
      s += `${icon[sec]} _${t("sec."+sec)}_\n`;
      rows.forEach(it => {
        const vol = [it.sets && it.reps ? `${it.sets} × ${it.reps}` : (it.sets || it.reps), it.weight, it.rest ? `${t("wk.rest")} ${it.rest}` : ""].filter(Boolean).join(" · ");
        s += `• ${it.name}${vol ? " — " + vol : ""}\n`;
      });
    });
    s += "\n";
  });
  if(w.note) s += `📝 ${w.note}\n\n`;
  return s + `🥤 ${t("wk.after")}`;
}

/* ================= PDF / 下载 / 复制 ================= */
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2400); }
function copy(text){
  const done = () => toast(t("toast.copied"));
  const fallback = () => {
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    ta.remove(); ok ? done() : toast(t("toast.copyfail"));
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
const fileBase = () => `BurnUp_${(S.rec.name || "MyPlan").replace(/[^\w一-龥-]+/g,"_")}_${S.view==="workout"?"Workout":"MealPlan"}_${new Date().toISOString().slice(0,10)}`;
function downloadBlob(content, type, filename){
  try{
    const url = URL.createObjectURL(new Blob([content], {type}));
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast(t("toast.downloaded",{f:filename}));
  }catch(e){ toast(t("toast.nodl")); }
}
function pdf(){
  saveRec(); render();
  const old = document.title; document.title = fileBase();
  toast(t("toast.pdf"));
  setTimeout(()=>{ window.print(); setTimeout(()=>document.title = old, 500); }, 300);
}
function snapshot(){
  saveRec(); render();
  const node = document.querySelector("main").cloneNode(true);
  node.querySelectorAll(".noprint").forEach(n=>n.remove());
  const css = document.getElementById("app-style").textContent;
  const html = `<!DOCTYPE html><html lang="${document.documentElement.lang}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(fileBase())}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>${css}</style></head><body class="snapshot"><main class="wrap narrow">${node.innerHTML}</main></body></html>`;
  downloadBlob(html, "text/html;charset=utf-8", fileBase() + ".html");
}

function finishQuiz(){
  if(!isCoach() && !cloudOn()) S.rec.mo = {};   // 本机学员重新计算时加餐恢复自动；云端会保留教练的调整
  if(isCoach() && !S.rec.id){ S.rec.id = cloudOn() ? FB.newId() : "s" + Date.now().toString(36); S.rec.created = Date.now(); }
  saveRec(); go(isCoach() ? "plan" : "today");
}
function nextStep(){ if(S.step < quizSteps().length-1){ S.step++; go("quiz"); } else finishQuiz(); }
const tplGoalFor = g => (g==="gain"||g==="keepGain") ? "build" : "burn";

$app.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.go){
    if(d.go==="home"){ if(isCoach()) S.rec = blankRec(); else if(!cloudOn()) S.rec = selfRec(); }
    return go(d.go);
  }
  if(d.auth){ S.authMode = d.auth; return go("auth"); }
  if("coach" in d && CLOUD && FB){ S.authMode = "signin"; return go("auth"); }
  if("logout" in d && cloudOn()){ FB.signOut(); return; }
  if("verified" in d){ FB.reloadUser().then(u=>{ if(u && u.verified) onUser(u); else toast(t("verify.notyet")); }).catch(ex=>toast(authErr(ex))); return; }
  if("resend" in d){ FB.sendVerify().then(()=>toast(t("verify.sent"))).catch(ex=>toast(authErr(ex))); return; }
  if("coach" in d){ S.role="coach"; SS.set("bu_role","coach"); S.rec=blankRec(); return go(S.authed ? "home" : "login"); }
  if("logout" in d){ S.authed=false; SS.del("bu_auth"); S.role="student"; SS.set("bu_role","student"); S.rec=selfRec(); return go("home"); }
  if("reset" in d){
    if(!S.arm){ S.arm=true; return render(); }
    LS.del(K_PIN); LS.del(K_STU); S.arm=false; toast(t("toast.reset")); return render();
  }
  if("start" in d && cloudOn() && !isCoach()){ S.step=0; return go(planReady(S.rec) ? "today" : "quiz"); }
  if("start" in d){ if(!isCoach()){ S.role="student"; SS.set("bu_role","student"); S.rec = selfRec(); if(planReady(S.rec)) return go("today"); } S.step=0; return go("quiz"); }
  if("myplan" in d){ if(!cloudOn()) S.rec = selfRec(); S.step=0; return go(planReady(S.rec) ? "today" : "quiz"); }
  if("fitlocked" in d){ if(cloudOn() && planReady(S.rec)) return go("workout"); return toast(t("fit.toast")); }
  if("workout" in d && !isCoach()) return go("workout");
  if("menu" in d){ S.menu = !S.menu; return render(); }
  if("install" in d && installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; S.sheet = null; render(); }); return; }
  if("getapp" in d){ S.sheet = "getapp"; S.sheetFresh = true; S.gaOS = null; return render(); }
  if(d.gaos){ S.gaOS = d.gaos; return render(); }
  if(d.copylink){ const b = d.copylink, url = location.origin + location.pathname, done = () => toast(t("ga.copied",{b}));
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => toast(url)); else toast(url); return; }
  if("installoff" in d){ LS.set("bu_pwa_off", true); return render(); }
  if("gohome" in d){ S.menu = false; if(!cloudOn()) S.rec = selfRec(); return go("home"); }
  if(d.eat){ const k = d.eat; let on; setDayLog(ymd(new Date()), x => { on = x.meals[k] = !x.meals[k]; }); render(); if(on) toast(t("photo.toast")); return; }
  if("wkdone" in d){ let on; setDayLog(ymd(new Date()), x => { on = x.wk = !x.wk; }); render(); if(on) toast(t("photo.toast")); return; }
  if("photo" in d){ setDayLog(ymd(new Date()), x => { x.photo = !x.photo; }); return render(); }
  if(d.sheet){ if(d.sheet === "sleep") openSleep(ymd(new Date())); else { S.sheet = d.sheet; S.sheetFresh = true; } return render(); }
  if("sheetclose" in d){ S.sheet = null; return render(); }
  if(d.water){ const g = waterGoal(S.rec)*1000; let before, after;
    setDayLog(ymd(new Date()), x => { before = x.water; x.water = Math.max(0, x.water + Number(d.water)); after = x.water; });
    render(); if(before < g && after >= g) toast(t("water.done")); return; }
  if(d.slq){ S.sheetData.q = S.sheetData.q === d.slq ? null : d.slq; return render(); }
  if("sleepsave" in d){ const D = S.sheetData, h = sleepHours(D.bed, D.wake);
    setDayLog(D.date, x => { x.sleep = {bed:D.bed, wake:D.wake, dur:h, q:D.q}; });
    S.sheet = null; render(); toast(t("sleep.saved",{h})); return; }
  if(d.mix){ S.mix = S.mix===d.mix ? null : d.mix; render(); if(S.mix) document.getElementById("mix")?.scrollIntoView({block:"nearest", behavior:"smooth"}); return; }
  if("mixreplay" in d) return render();
  if("new" in d){ S.rec = blankRec(); S.step=0; return go("quiz"); }
  if(d.open){ const s = (cloudOn() ? S.clients : students()).find(x=>x.id===d.open); if(!s) return; S.rec = normalize(s); S.step=0; return go(planReady(S.rec) ? "plan" : "quiz"); }
  if("back" in d){ S.step=Math.max(0,S.step-1); return go("quiz"); }
  if("edit" in d){ S.step=0; return go("quiz"); }
  if(d.pick !== undefined){
    const st = quizSteps()[S.step];
    S.rec.a[st.key] = st.key==="activity" ? Number(d.pick) : d.pick;
    return nextStep();
  }
  if("train" in d){ S.rec.training=!S.rec.training; saveRec(); return render(); }
  if(d.shake){ if(b.getAttribute("aria-disabled")) return; S.rec.shake[d.shake]=!S.rec.shake[d.shake]; saveRec(); return render(); }
  if(d.snack){ const [slot,id]=d.snack.split(":"); S.rec.mo[slot] = id==="none" ? {off:true} : {snack:id}; saveRec(); return render(); }
  if(d.copy) return copy(d.copy==="meal" ? mealText() : fitText());
  if("pdf" in d) return pdf();
  if("dl" in d) return snapshot();
  if("del" in d){
    if(!S.arm){ S.arm=true; return render(); }
    if(cloudOn()) FB.del(S.rec.id).catch(()=>toast(t("err.save"))); else LS.set(K_STU, students().filter(x=>x.id!==S.rec.id));
    toast(t("toast.deleted",{n:S.rec.name||""})); S.rec=blankRec(); return go("home");
  }
  if("export" in d){
    const data = {app:"burnup-coach", version:3, exported:new Date().toISOString(), students: cloudOn() ? S.clients : students()};
    return downloadBlob(JSON.stringify(data, null, 2), "application/json", `BurnUp_Clients_Backup_${new Date().toISOString().slice(0,10)}.json`);
  }
  if("import" in d) return document.getElementById("importFile").click();

  // ---- 以下教练专用 ----
  if(!isCoach()) return;
  const mo = S.rec.mo;
  if("tedit" in d){ S.editTarget=true; render(); document.getElementById("kcal-ovr")?.select(); return; }
  if("tcancel" in d){ S.editTarget=false; return render(); }
  if("tauto" in d){ S.rec.kcalOverride=null; S.editTarget=false; saveRec(); toast(t("toast.formula")); return render(); }
  if("tsave" in d){
    const v = parseInt(document.getElementById("kcal-ovr").value,10);
    if(!(v>=800 && v<=6000)) return toast(t("toast.kcalrange"));
    S.rec.kcalOverride=v; S.editTarget=false; saveRec(); toast(t("toast.kcalset",{n:v})); return render();
  }
  if(d.medit){ S.editMeal = S.editMeal===d.medit ? null : d.medit; return render(); }
  if("mclose" in d){ S.editMeal=null; return render(); }
  if(d.mset){ const [k,type,val]=d.mset.split(":"); mo[k] = type==="portion" ? {portion:+val} : type==="snack" ? {snack:val} : {on:true}; saveRec(); return render(); }
  if(d.mshake){
    if(b.getAttribute("aria-disabled")) return;
    const [k,id]=d.mshake.split(":"); const r=calc(S.rec); const cur=Object.assign({}, r.meals[k].shake || r.baseShake);
    cur[id]=!cur[id]; mo[k]={shake:cur}; saveRec(); return render();
  }
  if(d.mcustom){
    const k=d.mcustom, text=document.getElementById("ct-text-"+k).value.trim(), kc=parseInt(document.getElementById("ct-kcal-"+k).value,10);
    if(!text) return toast(t("toast.needtext"));
    if(!(kc>=0 && kc<=2500)) return toast(t("toast.kcal2500"));
    mo[k]={custom:{text, kcal:kc}}; saveRec(); return render();
  }
  if(d.mauto){ delete mo[d.mauto]; saveRec(); return render(); }
  if(d.moff){ mo[d.moff]={off:true}; saveRec(); return render(); }
  if("mreset" in d){ S.rec.mo={}; S.editMeal=null; saveRec(); toast(t("toast.resetall")); return render(); }

  const w = S.rec.workout;
  if("workout" in d){ S.tplGoal = tplGoalFor(S.rec.a.goal); return go("workout"); }
  if(d.tplgoal){ S.tplGoal = d.tplgoal; S.arm=false; S.armTpl=null; return render(); }
  if(d.tpl !== undefined){
    const n = parseInt(d.tpl,10);
    if(w.days.length && !(S.arm && S.armTpl===n)){ S.arm=true; S.armTpl=n; return render(); }
    w.days = n ? buildTemplate(n, S.tplGoal) : [blankDay(1)];
    S.arm=false; S.armTpl=null; saveRec(); return render();
  }
  if("addday" in d){
    w.days.push(blankDay(w.days.length+1)); saveRec(); render();
    const all = $app.querySelectorAll(".wday"); const last = all[all.length-1];
    if(last){ last.scrollIntoView({block:"start"}); last.querySelector("input.dn")?.select(); }
    return;
  }
  if(d.delday !== undefined){ w.days.splice(+d.delday,1); saveRec(); return render(); }
  if(d.addex){
    const [i,sec]=d.addex.split(":"); const list = w.days[+i][sec]; const prev = list[list.length-1];
    list.push(item("", prev ? prev.sets : (sec==="main"?"3":"1"), "", "", prev ? prev.rest : ""));
    saveRec(); render();
    const rows = $app.querySelectorAll(`.exr input.nm[data-wd="${i}"][data-ws="${sec}"]`); rows[rows.length-1]?.focus();
    return;
  }
  if(d.delex){ const [i,sec,j]=d.delex.split(":"); w.days[+i][sec].splice(+j,1); saveRec(); return render(); }
});

$app.addEventListener("submit", async e=>{
  e.preventDefault();
  const err = document.getElementById("err");
  if(e.target.id==="authf"){
    const val = id => (document.getElementById(id) || {}).value || "";
    const email = val("au-email").trim().toLowerCase(), pw = val("au-pw"), name = val("au-name").trim();
    const btn = document.getElementById("au-btn"); err.textContent = "";
    if(S.authMode==="signup" && !name){ err.textContent = t("err.name"); return; }
    btn.disabled = true;
    try{
      if(S.authMode==="signin") await FB.signIn(email, pw);
      else if(S.authMode==="signup"){ S.pendingName = name; await FB.signUp(email, pw); if(isCoachEmail(email)) await FB.sendVerify(); }
      else { await FB.resetPw(email); toast(t("auth.resetSent")); S.authMode = "signin"; return render(); }
    }catch(ex){ err.textContent = authErr(ex); btn.disabled = false; }
    return;
  }
  if(e.target.id==="loginf"){
    const p1 = document.getElementById("pin1").value.trim();
    const stored = LS.get(K_PIN, null);
    if(!/^\d{4,8}$/.test(p1)){ err.textContent=t("err.pin"); return; }
    if(stored){
      if(await hashPin(p1, stored.salt) !== stored.hash){ err.textContent=t("err.pinwrong"); return; }
    } else {
      if(p1 !== document.getElementById("pin2").value.trim()){ err.textContent=t("err.pinmatch"); return; }
      const salt = Math.random().toString(36).slice(2);
      if(!LS.set(K_PIN, {salt, hash: await hashPin(p1, salt)})){ err.textContent=t("err.storage"); return; }
    }
    S.authed = true; SS.set("bu_auth","1"); S.rec = blankRec(); return go("home");
  }
  const st = quizSteps()[S.step];
  const raw = e.target.querySelector("input").value;
  if(st.type==="text"){
    const v = raw.trim(); if(!v){ err.textContent=t("err.name"); return; }
    S.rec.name = v; return nextStep();
  }
  const v = parseFloat(raw);
  if(isNaN(v) || v<st.min || v>st.max){ err.textContent=t("err.range",{a:st.min, b:st.max}); return; }
  S.rec.a[st.key] = st.dec ? Math.round(v*10)/10 : Math.round(v);
  nextStep();
});

});

let FB = null;
async function loadFirebase(){
  if(window.__FB_MOCK) return window.__FB_MOCK;
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [AppM, A, F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
  const app = AppM.initializeApp(FIREBASE_CONFIG), auth = A.getAuth(app);
  let db;   // 云端资料在手机上留一份，没网络也能看
  try{ db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch(e){ db = F.getFirestore(app); }
  const col = F.collection(db, "clients");
  const me = u => u ? {uid:u.uid, email:(u.email||"").toLowerCase(), verified:u.emailVerified} : null;
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(me(u))),
    signIn: (e,p) => A.signInWithEmailAndPassword(auth, e, p),
    signUp: (e,p) => A.createUserWithEmailAndPassword(auth, e, p),
    signOut: () => A.signOut(auth),
    resetPw: e => A.sendPasswordResetEmail(auth, e),
    sendVerify: () => A.sendEmailVerification(auth.currentUser),
    reloadUser: async () => { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); return me(auth.currentUser); },
    watchDoc: (id, cb, err) => F.onSnapshot(F.doc(col, id), sn => cb(sn.exists() ? sn.data() : null, sn.metadata.hasPendingWrites), err),
    watchAll: (cb, err) => F.onSnapshot(col, sn => cb(sn.docs.map(x=>Object.assign(x.data(), {id:x.id})), sn.metadata.hasPendingWrites), err),
    save: (id, data) => F.setDoc(F.doc(col, id), data, {mergeFields: Object.keys(data)}),   // 只覆盖传入的栏位
    newId: () => F.doc(col).id,
    del: id => F.deleteDoc(F.doc(col, id))
  };
}
const typing = () => { const a = document.activeElement; return !!(a && $app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
// 云端资料更新：用户正在输入或在问答中时不重画，避免光标跳掉
function softRender(pending){ if(pending || S.view==="quiz" || S.view==="auth" || typing()) return; render(); }
function onCloudErr(ex){ console.warn(ex); toast(/permission/i.test(ex && ex.code || "") ? t("err.perm") : t("err.save")); }
function onUser(u){
  if(S.unsub){ S.unsub(); S.unsub = null; }
  S.user = u;
  if(!u){
    S.role = "student"; S.authed = false; S.clients = []; S.rec = selfRec();
    if(S.view !== "auth") S.view = "home";
    return render();
  }
  if(isCoachEmail(u.email)){
    S.role = "coach";
    if(!u.verified){ S.authed = false; return go("verify"); }
    S.authed = true; S.rec = blankRec(); go("home");
    S.unsub = FB.watchAll((list, pending) => {
      S.clients = list.map(normalize).sort((a,b)=>(b.updated||0)-(a.updated||0));
      if(S.rec.id && !pending && !S.dirty && !typing()){ const fresh = S.clients.find(c=>c.id===S.rec.id); if(fresh) S.rec = fresh; }
      softRender(pending);
    }, onCloudErr);
    return;
  }
  S.role = "student"; S.authed = false;
  let first = true;
  S.unsub = FB.watchDoc(u.uid, (data, pending) => {
    if(!data){
      // 第一次登入：建立学员档案；如果之前在本机试用过，把资料带过来
      const local = selfRec();
      const rec = planReady(local) ? local : blankRec();
      rec.name = S.pendingName || rec.name || "";
      FB.save(u.uid, Object.assign(clean(pick(rec, STUDENT_FIELDS)), {email:u.email, created:Date.now(), updated:Date.now()})).catch(onCloudErr);
      return;
    }
    if(S.dirty || (typing() && !first)) return;
    S.rec = normalize(Object.assign({}, data, {id:u.uid}));
    if(first){ first = false; S.step = 0; return go(planReady(S.rec) ? "today" : "quiz"); }
    softRender(pending);
  }, onCloudErr);
}

/* ================= PWA：离线 ================= */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW", e)));
}
window.addEventListener("offline", () => toast(t("net.off")));
window.addEventListener("online", () => toast(t("net.on")));

if(S.role==="coach" && !CLOUD){ S.rec = blankRec(); S.view = S.authed ? "home" : "login"; }
if(CLOUD){
  if(S.role==="coach" && !S.authed) S.role = "student";
  loadFirebase().then(fb => { FB = fb; FB.onAuth(onUser); })
    .catch(ex => { console.warn(ex); CLOUD = false; S.view = "home"; render(); toast(t("auth.offline")); });
}
render();
</script>
